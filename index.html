<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>MEA PM Planner — เขตสมุทรปราการ (Smart CMMS & Big Data 300+)</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<!-- SheetJS -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- Leaflet Map CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');

  :root{
    --navy: #091E36;
    --navy-dark: #051324;
    --navy-light: #133358;
    --electric: #0088FF;
    --electric-glow: rgba(0, 136, 255, 0.35);
    --blue-soft: #EBF4FE;
    --amber: #F59E0B;
    --amber-soft: #FEF3C7;
    --green: #10B981;
    --green-soft: #D1FAE5;
    --red: #EF4444;
    --red-soft: #FEE2E2;
    --purple: #8B5CF6;
    --purple-soft: #EDE9FE;
    --bg: #F0F4F9;
    --surface: #FFFFFF;
    --surface-glass: rgba(255, 255, 255, 0.9);
    --border: #E2E8F0;
    --text: #0F172A;
    --muted: #64748B;
    --bottom-nav-height: 66px;
    --radius: 16px;
    --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 20px 40px rgba(9, 30, 54, 0.15);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans Thai','Plus Jakarta Sans',sans-serif;
    background:var(--bg); color:var(--text);
    background-image: radial-gradient(at 0% 0%, rgba(0, 136, 255, 0.05) 0px, transparent 50%),
                      radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.05) 0px, transparent 50%);
    background-attachment: fixed;
  }
  #app{ width:100%; min-height:100vh; display:flex; flex-direction:column; }
  .shell{ display:flex; flex-direction:column; min-height:100vh; width:100%; }
  @media(min-width:768px){ .shell{ flex-direction:row; } }

  .card{
    background:var(--surface-glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.8); border-radius:var(--radius); padding:20px;
    box-shadow:var(--shadow-sm); transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:hover{ box-shadow:var(--shadow-md); }

  /* Login Card */
  .login-container{
    display:flex; align-items:center; justify-content:center; min-height:100vh; width:100%; padding:20px;
    background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 50%, #154374 100%);
  }
  .login-card{
    background:rgba(255, 255, 255, 0.95); backdrop-filter:blur(16px);
    border-radius:24px; padding:36px; width:100%; max-width:420px;
    box-shadow: var(--shadow-lg); border:1px solid rgba(255,255,255,0.6);
  }
  .login-logo{
    width:56px; height:56px; border-radius:16px; background:linear-gradient(135deg, var(--electric), #0055AA);
    display:inline-flex; align-items:center; justify-content:center; margin-bottom:16px;
    box-shadow: 0 8px 20px var(--electric-glow);
  }

  /* Topbar Mobile */
  .mobile-topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--navy); padding:14px 18px; color:#fff;
  }
  @media(min-width:768px){ .mobile-topbar{ display:none; } }

  /* Desktop Sidebar */
  .sidebar{
    background:var(--navy); padding:24px 18px; display:none; width:270px; flex-direction:column; flex-shrink:0;
  }
  @media(min-width:768px){ .sidebar{ display:flex; } }
  .brand{ display:flex; align-items:center; gap:12px; margin-bottom:24px; padding:0 6px; }
  .brand-icon{
    width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg, var(--electric), #005cb3);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 4px 14px var(--electric-glow);
  }
  .brand-title{ color:#fff; font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:16px; }
  .brand-sub{ color:#94A3B8; font-size:11px; margin-top:2px; }

  .user-badge{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,0.06); padding:10px 14px; border-radius:12px; margin-bottom:20px;
    border:1px solid rgba(255,255,255,0.08);
  }
  .user-badge-role{ font-size:13px; font-weight:600; color:#fff; }
  .user-badge-tag{ font-size:10px; font-weight:700; padding:3px 8px; border-radius:6px; background:var(--electric); color:#fff; }

  .nav-btn{
    display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px;
    font-size:14px; font-weight:500; color:#94A3B8; background:transparent;
    border:none; cursor:pointer; text-align:left; font-family:inherit; transition:0.2s;
  }
  .nav-btn:hover{ background:rgba(255,255,255,0.06); color:#fff; transform:translateX(3px); }
  .nav-btn.active{
    background:linear-gradient(135deg, var(--electric), #0066CC); color:#fff; font-weight:600;
    box-shadow:0 4px 14px var(--electric-glow);
  }

  /* Bottom Navigation */
  .bottom-nav{
    position:fixed; bottom:0; left:0; width:100%; height:var(--bottom-nav-height);
    background:rgba(9, 30, 54, 0.96); backdrop-filter:blur(16px);
    display:flex; align-items:center; justify-content:space-around;
    z-index:900; border-top:1px solid rgba(255,255,255,0.1); padding-bottom:env(safe-area-inset-bottom);
  }
  @media(min-width:768px){ .bottom-nav{ display:none; } }
  .b-nav-item{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; background:none; border:none; color:#94A3B8; font-size:10px; font-family:inherit;
    flex:1; height:100%; cursor:pointer; padding:4px 0;
  }
  .b-nav-item.active{ color:#00D2FF; font-weight:700; }
  .b-nav-item.active svg{ stroke:#00D2FF; }

  /* Main Area */
  .main{
    flex:1; padding:20px 16px; overflow-y:auto;
    padding-bottom:calc(var(--bottom-nav-height) + 30px);
  }
  @media(min-width:768px){ .main{ padding:36px; padding-bottom:36px; } }

  h2.section-title{ font-family:'Plus Jakarta Sans','Noto Sans Thai',sans-serif; font-size:22px; font-weight:800; color:var(--navy); margin:0; }
  .section-desc{ font-size:13px; color:var(--muted); margin:4px 0 0; }
  .section-header{ margin-bottom:20px; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px; }
  .header-actions{ display:flex; gap:8px; flex-wrap:wrap; width:100%; }
  @media(min-width:640px){ .header-actions{ width:auto; } }

  /* KPI Grid */
  .kpi-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:24px; }
  @media(min-width:1024px){ .kpi-grid{ grid-template-columns:repeat(4,1fr); gap:18px; } }
  .kpi-grid.kpi3{ grid-template-columns:repeat(2,1fr); }
  @media(min-width:1024px){ .kpi-grid.kpi3{ grid-template-columns:repeat(3,1fr); } }

  .kpi-card{ display:flex; flex-direction:column; gap:8px; border-left:4px solid var(--electric); }
  .kpi-card.green{ border-left-color: var(--green); }
  .kpi-card.amber{ border-left-color: var(--amber); }
  .kpi-card.purple{ border-left-color: var(--purple); }
  .kpi-card.red{ border-left-color: var(--red); }

  .kpi-top{ display:flex; align-items:center; justify-content:space-between; }
  .kpi-label{ font-size:13px; font-weight:600; color:var(--muted); }
  .kpi-icon{ border-radius:10px; padding:8px; display:flex; }
  .kpi-value{ font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:700; color:var(--navy); }
  @media(min-width:640px){ .kpi-value{ font-size:28px; } }
  .kpi-sub{ font-size:11px; color:var(--muted); }

  #map-container{ height: 380px; width: 100%; border-radius: 14px; z-index: 1; border: 1px solid var(--border); }

  /* Charts */
  .chart-grid{ display:grid; grid-template-columns:1fr; gap:18px; margin-bottom:24px; }
  @media(min-width:1024px){ .chart-grid{ grid-template-columns:1fr 1fr; } }
  .chart-card h3{ font-size:15px; font-weight:700; color:var(--navy); margin:0 0 16px; }
  .chart-wrap{ height:280px; position:relative; width:100%; }
  @media(min-width:640px){ .chart-wrap{ height:320px; } }

  /* Forms & Toolbar */
  .toolbar{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .toolbar input, .toolbar select{
    padding:10px 14px; border:1px solid var(--border); border-radius:10px; font-size:13px; font-family:inherit; background:var(--surface); flex:1; min-height:44px;
  }
  form.entry-form{ background:var(--surface-glass); border:1px solid var(--border); border-radius:var(--radius); padding:20px; display:grid; grid-template-columns:1fr; gap:16px; margin-bottom:24px; box-shadow:var(--shadow-sm); }
  @media(min-width:640px){ form.entry-form{ grid-template-columns:1fr 1fr; } }
  @media(min-width:1024px){ form.entry-form{ grid-template-columns:1fr 1fr 1fr; } }
  .field{ display:flex; flex-direction:column; gap:6px; font-size:13px; }
  .field-label{ color:var(--muted); font-weight:600; font-size:12px; }
  .field input, .field select, .field textarea{ width:100%; border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:14px; outline:none; background:var(--surface); color:var(--text); font-family:inherit; transition:.15s; min-height:44px; }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--electric); box-shadow:0 0 0 3px var(--electric-glow); }
  .span-all{ grid-column:1/-1; }
  .form-actions{ grid-column:1/-1; display:flex; justify-content:flex-end; gap:10px; }

  .btn-primary{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:10px; padding:12px 20px; font-size:14px; font-weight:600; color:#fff; background:linear-gradient(135deg, var(--electric), #0066CC); cursor:pointer; font-family:inherit; transition:0.2s; min-height:44px; width:100%; box-shadow:0 4px 12px var(--electric-glow); }
  @media(min-width:640px){ .btn-primary{ width:auto; } }
  .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 6px 16px var(--electric-glow); }
  .btn-secondary{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--border); border-radius:10px; padding:10px 16px; font-size:13px; font-weight:600; color:var(--text); background:var(--surface); cursor:pointer; font-family:inherit; transition:0.2s; min-height:42px; }
  .btn-secondary:hover{ background:var(--bg); }
  .btn-success{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:10px; padding:10px 16px; font-size:13px; font-weight:600; color:#fff; background:linear-gradient(135deg, #10B981, #059669); cursor:pointer; font-family:inherit; transition:0.2s; min-height:42px; }
  .btn-success:hover{ transform:translateY(-1px); }

  /* Mobile Record List */
  .mobile-record-list{ display:flex; flex-direction:column; gap:12px; }
  @media(min-width:768px){ .mobile-record-list{ display:none; } }
  .m-record-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow-sm);
  }
  .m-card-id{ font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--electric); font-size:15px; }

  /* Desktop Table */
  .desktop-table-wrap{ display:none; overflow-x:auto; }
  @media(min-width:768px){ .desktop-table-wrap{ display:block; } }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; padding:12px 14px 12px 0; font-weight:700; color:var(--muted); border-bottom:2px solid var(--border); white-space:nowrap; }
  td{ padding:14px 14px 14px 0; border-bottom:1px solid var(--border); white-space:nowrap; vertical-align:middle; }
  .mono{ font-family:'JetBrains Mono',monospace; }

  .pill{ display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:4px 10px; font-size:11px; font-weight:600; }
  .capacity-pill{ display:inline-flex; align-items:center; border-radius:6px; padding:2px 8px; font-size:11px; font-weight:700; font-family:'JetBrains Mono',monospace; background:var(--purple-soft); color:var(--purple); border:1px solid #DDD6FE; }
  
  .btn-sm{ padding:6px 12px; font-size:12px; border-radius:8px; border:1px solid var(--electric); background:var(--blue-soft); color:var(--electric); cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; justify-content:center; font-weight:600; min-height:34px; transition:0.15s; }
  .btn-sm:hover{ background:var(--electric); color:#fff; }

  .bench-grid{ display:grid; grid-template-columns:1fr; gap:12px; margin-bottom:20px; }
  @media(min-width:640px){ .bench-grid{ grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px; } }
  .bench-label{ font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px; }

  .alert-box{ padding:10px 14px; border-radius:8px; background:var(--red-soft); color:var(--red); font-size:13px; margin-bottom:16px; }

  /* Photo Preview */
  .photo-preview-wrap{ display:flex; align-items:center; gap:12px; margin-top:6px; flex-wrap:wrap; }
  .photo-thumb{ width:70px; height:70px; border-radius:8px; object-fit:cover; border:2px solid var(--border); box-shadow:var(--shadow-sm); cursor:pointer; }

  .modal-backdrop{
    position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(9,30,54,0.7);
    display:flex; align-items:flex-end; justify-content:center; z-index:9999; padding:0; backdrop-filter:blur(4px);
  }
  @media(min-width:640px){ .modal-backdrop{ align-items:center; padding:20px; } }
  .modal-card{
    background:var(--surface); border-radius:24px 24px 0 0; width:100%; max-width:640px;
    max-height:88vh; overflow-y:auto; padding:24px; box-shadow:var(--shadow-lg);
  }
  @media(min-width:640px){ .modal-card{ border-radius:20px; } }

  @media print {
    body { background: #fff !important; color: #000 !important; font-size: 11pt; }
    .sidebar, .toolbar, .form-actions, form, .btn-sm, .header-actions, .status-select, button, .modal-backdrop, .bottom-nav, .mobile-topbar { display: none !important; }
    .main { padding: 0 !important; }
    .card { border: none !important; box-shadow: none !important; padding: 0 !important; }
    .chart-grid, #map-container { display: none !important; }
    .desktop-table-wrap { display: block !important; }
    .mobile-record-list { display: none !important; }
    table { width: 100% !important; border-collapse: collapse !important; margin-top: 10px; }
    th, td { border: 1px solid #ccc !important; padding: 6px 8px !important; }
  }

  svg.ic{ display:block; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<input type="file" id="excel-importer" accept=".xlsx, .xls, .csv" style="display:none;" />

function generate300Records(){
  const today = new Date();
  const iso = (off) => { const d = new Date(today); d.setDate(d.getDate() + off); return d.toISOString().slice(0,10); };
  const benchmarks = { "หม้อแปลงจำหน่าย": 8500, "LBS": 4200, "UNIT SUBSTATION": 12500, "รีโคลสเซอร์ (Recloser)": 6500, "ดรอปเอาท์ฟิวส์": 2500 };
  const typePrefix = { "หม้อแปลงจำหน่าย":"TR-SP-", "LBS":"LBS-SP-", "UNIT SUBSTATION":"US-SP-", "รีโคลสเซอร์ (Recloser)":"RC-SP-", "ดรอปเอาท์ฟิวส์":"DF-SP-" };

  const pmRecords = [];
  for (let i = 1; i <= 300; i++) {
    const eqType = EQUIPMENT_TYPES[i % EQUIPMENT_TYPES.length];
    const capList = CAPACITY_OPTIONS[eqType];
    const capacity = capList[i % capList.length];
    const tech = TECHNICIANS[i % TECHNICIANS.length];
    const loc = LOCATIONS_LIST[i % LOCATIONS_LIST.length];
    const dayOffset = -Math.floor(i * 0.4);
    
    const bench = benchmarks[eqType];
    const varianceFactor = 0.75 + (Math.sin(i) + 1) * 0.25;
    const totalCalc = Math.round(bench * varianceFactor);
    const materialCost = Math.round(totalCalc * 0.55);
    const laborCost = Math.round(totalCalc * 0.35);
    const otherCost = totalCalc - materialCost - laborCost;
    const laborHours = +(2.5 + (i % 6) * 1.0).toFixed(1);
    const status = i <= 285 ? "เสร็จสิ้น" : (i <= 295 ? "ระหว่างดำเนินการ" : "รอดำเนินการ");
    const healthIndex = Math.min(100, Math.max(70, Math.round(98 - (i % 25))));

    pmRecords.push({
      id: "PM-SP-" + (1000 + i),
      date: iso(dayOffset),
      equipmentType: eqType,
      capacity: capacity,
      equipmentId: typePrefix[eqType] + String(100 + i).padStart(4, '0'),
      location: loc,
      team: tech.team,
      technician: tech.name,
      laborHours: laborHours,
      materialCost: materialCost,
      laborCost: laborCost,
      otherCost: otherCost,
      maintenanceType: (i % 12 === 0) ? "แก้ไข" : "ป้องกัน",
      status: status,
      notes: `ตรวจเช็คตามรอบบำรุงรักษาประจำปี วัดค่าความต้านทานฉนวนปกติ Health Index ${healthIndex}%`,
      photo: ""
    });
  }

  const planRecords = [];
  for (let j = 1; j <= 50; j++) {
    const eqType = EQUIPMENT_TYPES[(j * 2) % EQUIPMENT_TYPES.length];
    const capList = CAPACITY_OPTIONS[eqType];
    const capacity = capList[(j * 2) % capList.length];
    const tech = TECHNICIANS[(j * 3) % TECHNICIANS.length];
    const loc = LOCATIONS_LIST[(j * 2) % LOCATIONS_LIST.length];
    const plannedOffset = Math.floor(j * 0.6) + 1;

    planRecords.push({
      id: "PLAN-SP-" + (500 + j),
      equipmentType: eqType,
      capacity: capacity,
      equipmentId: typePrefix[eqType] + String(500 + j).padStart(4, '0'),
      location: loc,
      plannedDate: iso(plannedOffset),
      team: tech.team,
      priority: (j % 3 === 0) ? "สูง" : ((j % 2 === 0) ? "กลาง" : "ต่ำ"),
      status: (j % 15 === 0) ? "เลื่อน" : "วางแผน"
    });
  }

  return { benchmarks, pmRecords, planRecords };
}

function init(){
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    STATE = saved ? JSON.parse(saved) : generate300Records();
    const auth = localStorage.getItem(AUTH_KEY);
    if(auth) CURRENT_USER = JSON.parse(auth);
  } catch(e) {
    STATE = generate300Records();
  }
  render();
}

function persist(next){
  STATE = next;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); } catch(e){}
  render();
}

function statusPill(status){
  const map = {
    "เสร็จสิ้น":{bg:C.greenSoft,fg:C.green,icon:'check'},
    "กำลังดำเนินการ":{bg:C.blueSoft,fg:C.blue,icon:'pulse'},
    "ระหว่างดำเนินการ":{bg:C.blueSoft,fg:C.blue,icon:'pulse'},
    "รอดำเนินการ":{bg:C.amberSoft,fg:C.amber,icon:'circle'},
    "วางแผน":{bg:C.amberSoft,fg:C.amber,icon:'circle'},
    "เลื่อน":{bg:C.redSoft,fg:C.red,icon:'alert'},
  };
  const s = map[status] || {bg:C.border,fg:C.muted,icon:'circle'};
  return `<span class="pill" style="background:${s.bg};color:${s.fg}">
    ${s.icon==='check'?ICONS.check(s.fg):'•'} ${esc(status)}
  </span>`;
}

function exportToExcel(filename, sheetName, dataArray) {
  if (typeof XLSX === 'undefined') return alert("ระบบกำลังโหลดโมดูล Excel");
  const ws = XLSX.utils.aoa_to_sheet(dataArray);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, filename + ".xlsx");
}

function triggerExcelImport(target) {
  IMPORT_TARGET = target;
  const fileInput = document.getElementById("excel-importer");
  if (fileInput) { fileInput.value = ""; fileInput.click(); }
}

function handleFileImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
      if (rows.length < 2) return;

      if (IMPORT_TARGET === "pm") {
        const imported = [];
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r || !r[1] || !r[3]) continue;
          imported.push({
            id: uid(),
            date: r[0] ? String(r[0]).slice(0,10) : new Date().toISOString().slice(0,10),
            equipmentType: r[1] || EQUIPMENT_TYPES[0],
            capacity: r[2] || CAPACITY_OPTIONS[r[1]||EQUIPMENT_TYPES[0]][0],
            equipmentId: String(r[3]),
            location: r[4] || "",
            team: r[5] || "ทีม A",
            technician: r[6] || "",
            laborHours: Number(r[7]) || 0,
            materialCost: Number(r[8]) || 0,
            laborCost: Number(r[9]) || 0,
            otherCost: Number(r[10]) || 0,
            maintenanceType: r[12] || "ป้องกัน",
            status: r[13] || "เสร็จสิ้น",
            notes: r[14] || "นำเข้าจาก Excel",
            photo: ""
          });
        }
        if(imported.length){
          persist({ ...STATE, pmRecords: [...imported, ...STATE.pmRecords] });
          alert(`นำเข้าสำเร็จ ${imported.length} รายการ`);
        }
      }
    } catch(err) { alert("เกิดข้อผิดพลาดในการอ่านไฟล์"); }
  };
  reader.readAsArrayBuffer(file);
}

function recordsTable(records, {withDelete, compact} = {}){

    if(!SEARCH_QUERY) return true;
    const q = SEARCH_QUERY.toLowerCase();
    return (r.equipmentId||"").toLowerCase().includes(q) ||
           (r.location||"").toLowerCase().includes(q) ||
           (r.team||"").toLowerCase().includes(q) ||
           (r.technician||"").toLowerCase().includes(q) ||
           (r.capacity||"").toLowerCase().includes(q) ||
           (r.equipmentType||"").toLowerCase().includes(q);
  });

  if(!filtered.length) return emptyState("ไม่พบข้อมูลที่ตรงกับเงื่อนไข");

  const mobileCardsHtml = `
    <div class="mobile-record-list">
      ${filtered.slice(0, 50).map(r=>{
        const total = Number(r.materialCost)+Number(r.laborCost)+Number(r.otherCost);
        const bench = STATE.benchmarks[r.equipmentType] || 0;
        const diff = bench ? total - bench : 0;
        const diffHtml = bench ? (diff <= 0 
          ? `<span style="color:${C.green};font-size:11px;font-weight:700;">(ประหยัด ${baht(Math.abs(diff))})</span>` 
          : `<span style="color:${C.red};font-size:11px;font-weight:700;">(+${baht(diff)})</span>`) : "";

        return `
          <div class="m-record-card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
              <div>
                <div class="m-card-id">${esc(r.equipmentId)} <span class="capacity-pill">${esc(r.capacity||"-")}</span></div>
                <div style="font-size:12px;color:var(--text);font-weight:600;margin-top:2px;">${esc(r.equipmentType)}</div>
                <div style="font-size:12px;color:var(--muted);margin-top:2px;">${thDate(r.date)} • ${esc(r.team)} ${r.technician ? `• ${esc(r.technician)}` : ""}</div>
              </div>
              <div>${statusPill(r.status)}</div>
            </div>
            <div style="font-size:12px;color:var(--muted);">${esc(r.location||"-")}</div>
            ${r.photo ? `<div style="margin-top:4px;"><img src="${r.photo}" class="photo-thumb" onclick="window.open('${r.photo}')" title="กดดูรูปขนาดเต็ม" /></div>` : ''}

              <div style="font-size:14px;font-weight:700;font-family:'JetBrains Mono',monospace;">
                ${baht(total)} ${diffHtml}

              <div style="display:flex;gap:6px;">
                <button class="btn-sm" data-edit-pm="${r.id}">${ICONS.edit} แก้ไข</button>
                ${withDelete && !compact && CURRENT_USER?.role === 'admin' ? `<button class="btn-sm" style="border-color:var(--red);background:var(--red-soft);color:var(--red);" data-del-pm="${r.id}">${ICONS.trash}</button>` : ""}
              </div>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;

  const headers = ["วันที่","อุปกรณ์","ขนาดพิกัด","รหัส","สายป้อน / พื้นที่","รูปถ่าย","ทีม","ผู้ปฏิบัติงาน","ต้นทุนรวม","WCM Diff","สถานะ",""];
  const desktopTableHtml = `
    <div class="desktop-table-wrap">
      <table>
        <thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>
          ${filtered.slice(0, 100).map(r=>{
            const total = Number(r.materialCost)+Number(r.laborCost)+Number(r.otherCost);
            const bench = STATE.benchmarks[r.equipmentType] || 0;
            const diff = bench ? total - bench : 0;
            const diffHtml = bench ? (diff <= 0 
              ? `<span style="color:${C.green};font-size:11px;font-weight:700;">ประหยัด ${baht(Math.abs(diff))}</span>` 
              : `<span style="color:${C.red};font-size:11px;font-weight:700;">+${baht(diff)}</span>`) : "-";

function attachModalListeners(){
  const closeBtn = document.getElementById("modal-close-btn");
  const cancelBtn = document.getElementById("modal-cancel-btn");
  const backdrop = document.getElementById("modal-backdrop");
  const closeModal = () => { EDITING_RECORD = null; renderModal(); };

  if(closeBtn) closeBtn.onclick = closeModal;
  if(cancelBtn) cancelBtn.onclick = closeModal;
  if(backdrop) backdrop.onclick = (e) => { if(e.target === backdrop) closeModal(); };

  const mGpsBtn = document.getElementById("m-gps-btn");
  if(mGpsBtn){
    mGpsBtn.onclick = () => {
      if("geolocation" in navigator){
        mGpsBtn.innerText = "กำลังหาพิกัด...";
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const locInput = document.getElementById("m-location");
            if(locInput){
              locInput.value = `พิกัด GPS: ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
            }
            mGpsBtn.innerHTML = `${ICONS.gps} ดึง GPS`;
          },
          (err) => {
            alert("ไม่สามารถเข้าถึงตำแหน่งได้ กรุณาเปิดสิทธิ์ GPS ในเบราว์เซอร์");
            mGpsBtn.innerHTML = `${ICONS.gps} ดึง GPS`;
          },
          { timeout: 10000 }
        );
      } else {
        alert("อุปกรณ์นี้ไม่รองรับระบบระบุตำแหน่ง GPS");
      }
    };
  }

  let modalPhotoBase64 = EDITING_RECORD?.data?.photo || "";
  const mPhotoInput = document.getElementById("m-photo-input");
  if(mPhotoInput){
    mPhotoInput.onchange = (e) => {
      const file = e.target.files[0];
      if(file){
        const reader = new FileReader();
        reader.onload = (evt) => {
          modalPhotoBase64 = evt.target.result;
          const prev = document.getElementById("m-photo-preview");
          if(prev) prev.innerHTML = `<img src="${modalPhotoBase64}" class="photo-thumb" id="m-thumb-img"/>`;
        };
        reader.readAsDataURL(file);
      }
    };
  }

  const editTypeSelect = document.getElementById("m-equipmentType");
  if(editTypeSelect){
    editTypeSelect.onchange = () => {
      const selectedType = editTypeSelect.value;
      const capSelect = document.getElementById("m-capacity");
      if(capSelect && CAPACITY_OPTIONS[selectedType]){
        capSelect.innerHTML = CAPACITY_OPTIONS[selectedType].map(c=>`<option>${c}</option>`).join("");
      }
    };
  }

  const editPmForm = document.getElementById("edit-pm-form");
  if(editPmForm){
    editPmForm.onsubmit = (e) => {
      e.preventDefault();
      const val = id => document.getElementById(id).value;
      const updated = {
        ...EDITING_RECORD.data,
        date: val("m-date"), equipmentType: val("m-equipmentType"), capacity: val("m-capacity"),
        equipmentId: val("m-equipmentId"), location: val("m-location"), team: val("m-team"), technician: val("m-technician"),
        laborHours: Number(val("m-laborHours"))||0, materialCost: Number(val("m-materialCost"))||0,
        laborCost: Number(val("m-laborCost"))||0, otherCost: Number(val("m-otherCost"))||0,
        maintenanceType: val("m-maintenanceType"), status: val("m-status"), notes: val("m-notes"),
        photo: modalPhotoBase64
      };
      persist({ ...STATE, pmRecords: STATE.pmRecords.map(r => r.id === updated.id ? updated : r) });
      EDITING_RECORD = null; renderModal();
    };
  }
}

function drawDashboardCharts(){
  const {pmRecords, benchmarks} = STATE;
  if (typeof Chart === 'undefined') return;
  if(CHARTS.cost) { CHARTS.cost.destroy(); CHARTS.cost = null; }
  if(CHARTS.cap) { CHARTS.cap.destroy(); CHARTS.cap = null; }

  const costByType = EQUIPMENT_TYPES.map(t=>{
    const recs = pmRecords.filter(r=>r.equipmentType===t);
    const cost = recs.reduce((s,r)=>s+Number(r.materialCost)+Number(r.laborCost)+Number(r.otherCost),0);
    return { type:t, actual: recs.length ? Math.round(cost/recs.length) : 0, bench: benchmarks[t]||0 };
  });

  const formattedLabels = ["หม้อแปลงจำหน่าย","LBS",["UNIT","SUBSTATION"],["รีโคลสเซอร์","(Recloser)"],"ดรอปเอาท์ฟิวส์"];
  const costCtx = document.getElementById("costChart");
  if(costCtx){
    CHARTS.cost = new Chart(costCtx, {
      type:"bar",
      data:{
        labels: formattedLabels,
        datasets:[
          {label:"ต้นทุนจริงเฉลี่ย", data: costByType.map(d=>d.actual), backgroundColor:C.blue, borderRadius:6, barPercentage: 0.7},
          {label:"เกณฑ์ WCM", data: costByType.map(d=>d.bench), backgroundColor:C.amber, borderRadius:6, barPercentage: 0.7},
        ]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{position:"bottom", labels:{font:{family:"'Noto Sans Thai', sans-serif", size:11}, padding: 14}} },
        scales:{
          y:{ grid:{color:C.border}, ticks:{font:{family:"'JetBrains Mono', monospace", size:10}, callback:(v)=>v.toLocaleString()} },
          x:{ grid:{display:false}, ticks:{font:{family:"'Noto Sans Thai', sans-serif", size:10, weight:'600'}, maxRotation: 0, minRotation: 0} }
        }
      }
    });
  }

  const capMap = {};
  pmRecords.forEach(r => {
    const key = r.capacity || "ไม่ระบุขนาด";
    capMap[key] = (capMap[key] || 0) + 1;
  });
  const capLabels = Object.keys(capMap);
  const capCtx = document.getElementById("capacityChart");
  if(capCtx){
    CHARTS.cap = new Chart(capCtx, {
      type:"doughnut",
      data:{
        labels: capLabels,
        datasets:[{
          data: Object.values(capMap),
          backgroundColor: [C.blue, C.green, C.amber, C.purple, C.red, '#06B6D4', '#EC4899', '#84CC16', '#F97316', '#6366F1', '#14B8A6'],
          borderWidth: 2, borderColor: '#fff'
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{position:"right", labels:{font:{family:"'JetBrains Mono', 'Noto Sans Thai', sans-serif", size:10}, boxWidth: 10}} }
      }
    });
  }
}

function initMap(){

  if(!container || typeof L === 'undefined') return;
  if(LEAFLET_MAP) { LEAFLET_MAP.remove(); LEAFLET_MAP = null; }

  LEAFLET_MAP = L.map('map-container').setView([13.5850, 100.6380], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(LEAFLET_MAP);

  L.marker([13.5991, 100.5968]).addTo(LEAFLET_MAP)
    .bindPopup('<b>กฟน. เขตสมุทรปราการ</b><br>จุดเริ่มต้นศูนย์สั่งการ').openPopup();

  STATE.pmRecords.slice(0, 15).forEach((r, idx) => {
    const coords = [13.52 + (idx * 0.011) % 0.16, 100.56 + (idx * 0.017) % 0.24];
    L.circleMarker(coords, { radius: 7, fillColor: C.blue, color: "#fff", weight: 2, fillOpacity: 0.9 })

      .bindPopup(`<b>${esc(r.equipmentId)}</b> (${esc(r.capacity||"-")})<br>${esc(r.location)}<br>ทีม: ${esc(r.team)}`);

function renderCost(){
  const {pmRecords, benchmarks} = STATE;
  const rows = EQUIPMENT_TYPES.map(t=>{
    const recs = pmRecords.filter(r=>r.equipmentType===t);

    const avg = recs.length ? totalCost/recs.length : 0;
    const bench = benchmarks[t]||0;
    const variance = bench ? (avg-bench)/bench*100 : 0;
    return {type:t, count:recs.length, totalCost, avg, bench, variance};
  });
  return `
    ${sectionHeader("วิเคราะห์ต้นทุนเทียบเกณฑ์ WCM", `คำนวณจากประวัติงาน PM จริงทั้ง ${pmRecords.length} รายการ`, `

function renderKpi(){
  const {pmRecords, planRecords} = STATE;
  const byPerson = {};
  pmRecords.forEach(r=>{
    const key = r.technician || "ไม่ระบุผู้ปฏิบัติงาน";
    byPerson[key] = byPerson[key] || {tasks:0, completedTasks:0, hours:0, cost:0, team:r.team};
    byPerson[key].tasks += 1;
    byPerson[key].hours += Number(r.laborHours)||0;
    byPerson[key].cost += Number(r.materialCost)+Number(r.laborCost)+Number(r.otherCost);
    if(r.status==="เสร็จสิ้น") byPerson[key].completedTasks += 1;
  });
  const rows = Object.entries(byPerson).map(([name,v])=>({
    name, team:v.team, tasks:v.tasks,
    completionRate: v.tasks ? Math.round(v.completedTasks/v.tasks*100) : 0,
    productivity: v.hours ? +(v.completedTasks/v.hours).toFixed(2) : 0,
    cost: v.cost,
  })).sort((a,b)=>b.productivity-a.productivity);
  const planCompletion = planRecords.length ? Math.round(planRecords.filter(p=>p.status==="เสร็จสิ้น").length/planRecords.length*100) : 0;
  const avgProd = rows.length ? (rows.reduce((s,r)=>s+r.productivity,0)/rows.length).toFixed(2) : "0.00";

  return `
    ${sectionHeader("ตัวชี้วัดประสิทธิภาพ (Labor Productivity)","วิเคราะห์ผลงานรายบุคคลและทีมตามมาตรฐาน WCM", `
      <button class="btn-secondary" id="print-pdf-btn">${ICONS.filePdf} พิมพ์ PDF</button>
    `)}
    <div class="kpi-grid kpi3">
      ${kpiCard("gauge","ปิดแผนงานสำเร็จ", planCompletion+"%", "ของแผนงานทั้งหมด", "green")}
      ${kpiCard("trophy","จำนวนช่างที่บันทึก", rows.length, "ผู้รับผิดชอบงาน", "electric")}
      ${kpiCard("gauge","Productivity เฉลี่ย", avgProd, "งานเสร็จ / ชม.แรงงาน", "amber")}
    </div>
    <div class="card chart-card">
      <h3>ประสิทธิภาพรายบุคคล (${pmRecords.length} งาน)</h3>
      ${rows.length ? `<div class="table-wrap"><table><thead><tr>
        <th>ผู้ปฏิบัติงาน</th><th>ทีม</th><th>งานทั้งหมด</th><th>อัตราสำเร็จ</th><th>Productivity</th><th>ต้นทุน</th>
      </tr></thead><tbody>
      ${rows.map(r=>`<tr>
        <td><strong>${esc(r.name)}</strong></td>
        <td class="muted">${esc(r.team)}</td>
        <td class="mono">${r.tasks}</td>
        <td class="mono">${r.completionRate}%</td>
        <td class="mono" style="color:var(--electric);font-weight:700;">${r.productivity}</td>
        <td class="mono">${baht(r.cost)}</td>
      </tr>`).join("")}
      </tbody></table></div>` : emptyState("ยังไม่มีข้อมูลผู้ปฏิบัติงาน")}
    </div>
  `;
}

function attachGlobalListeners(){
  document.querySelectorAll("[data-tab]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ TAB = btn.getAttribute("data-tab"); SEARCH_QUERY = ""; render(); });
  });

  const goGuideBtn = document.getElementById("go-guide-btn");
  if(goGuideBtn) goGuideBtn.onclick = () => { TAB = "guide"; render(); };

  const mMoreBtn = document.getElementById("m-more-btn");
  if(mMoreBtn){
    mMoreBtn.onclick = () => {
      if(CURRENT_USER?.role === 'admin'){
        if(TAB === 'plan') TAB = 'cost';
        else if(TAB === 'cost') TAB = 'kpi';
        else TAB = 'plan';
      } else { TAB = 'plan'; }
      render();
    };
  }

  const logoutHandler = () => { CURRENT_USER = null; localStorage.removeItem(AUTH_KEY); render(); };
  const logoutBtn = document.getElementById("logout-btn");
  if(logoutBtn) logoutBtn.onclick = logoutHandler;
  const mLogoutBtn = document.getElementById("m-logout-btn");
  if(mLogoutBtn) mLogoutBtn.onclick = logoutHandler;

  const clearBtn = document.getElementById("clear-btn");
  if(clearBtn) clearBtn.onclick = () => { 
    if(confirm("ต้องการรีเซ็ตและสร้างชุดข้อมูลจำลองขนาดใหญ่ 300+ รายการหรือไม่?")) {
      persist(generate300Records()); 
    }
  };

  document.querySelectorAll("#print-pdf-btn").forEach(btn => btn.addEventListener("click", () => window.print()));
  const fileImporter = document.getElementById("excel-importer");
  if (fileImporter) fileImporter.onchange = handleFileImport;
}

function attachTabListeners(){
  if(TAB==="routes"){
    const teamSelect = document.getElementById("route-team-select");
    if(teamSelect) teamSelect.onchange = (e) => { ROUTE_TEAM_FILTER = e.target.value; render(); };
  }

  if(TAB==="entry" || TAB==="dashboard"){
    document.querySelectorAll("[data-edit-pm]").forEach(btn=>{
      btn.onclick = () => {
        const id = btn.getAttribute("data-edit-pm");
        const item = STATE.pmRecords.find(r => r.id === id);
        if(item){ EDITING_RECORD = { type: "pm", data: { ...item } }; renderModal(); }
      };
    });
  }

  if(TAB==="entry"){
    const gpsBtn = document.getElementById("f-gps-btn");
    if(gpsBtn){
      gpsBtn.onclick = () => {
        if("geolocation" in navigator){
          gpsBtn.innerText = "กำลังค้นหา...";
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const locInput = document.getElementById("f-location");
              if(locInput){
                locInput.value = `พิกัด GPS: ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
              }
              gpsBtn.innerHTML = `${ICONS.gps} ดึง GPS`;
            },
            (err) => {
              alert("ไม่สามารถเข้าถึงตำแหน่งได้ กรุณาเปิดสิทธิ์ GPS ในเบราว์เซอร์");
              gpsBtn.innerHTML = `${ICONS.gps} ดึง GPS`;
            },
            { timeout: 10000 }
          );
        } else {
          alert("อุปกรณ์นี้ไม่รองรับระบบระบุตำแหน่ง GPS");
        }
      };
    }

    const photoInput = document.getElementById("f-photo-input");
    if(photoInput){
      photoInput.onchange = (e) => {
        const file = e.target.files[0];
        if(file){
          const reader = new FileReader();
          reader.onload = (evt) => {
            pmPhotoBase64 = evt.target.result;
            const prev = document.getElementById("f-photo-preview");
            if(prev) prev.innerHTML = `<img src="${pmPhotoBase64}" class="photo-thumb"/>`;
          };
          reader.readAsDataURL(file);
        }
      };
    }

    const typeSelect = document.getElementById("f-equipmentType");
    if(typeSelect){
      typeSelect.onchange = () => {
        const selectedType = typeSelect.value;
        const capSelect = document.getElementById("f-capacity");
        if(capSelect && CAPACITY_OPTIONS[selectedType]){
          capSelect.innerHTML = CAPACITY_OPTIONS[selectedType].map(c=>`<option>${c}</option>`).join("");
        }
      };
    }

    const form = document.getElementById("pm-form");
    if(form){
      form.onsubmit = (e)=>{
        e.preventDefault();
        const val = id => document.getElementById(id).value;
        const record = {
          date: val("f-date"), equipmentType: val("f-equipmentType"), capacity: val("f-capacity"), equipmentId: val("f-equipmentId"), location: val("f-location"),
          team: val("f-team"), technician: val("f-technician"), laborHours: Number(val("f-laborHours"))||0,
          materialCost: Number(val("f-materialCost"))||0, laborCost: Number(val("f-laborCost"))||0,
          otherCost: Number(val("f-otherCost"))||0, maintenanceType: val("f-maintenanceType"),
          status: val("f-status"), notes: val("f-notes"), photo: pmPhotoBase64, id: uid(),
        };
        pmForm = emptyPm();
        pmPhotoBase64 = "";
        persist({ ...STATE, pmRecords: [record, ...STATE.pmRecords] });
      };
    }

    const searchInput = document.getElementById("search-input");
    if(searchInput) searchInput.oninput = (e)=>{ SEARCH_QUERY = e.target.value; render(); };

    const exportExcelBtn = document.getElementById("export-pm-excel-btn");
    if(exportExcelBtn){
      exportExcelBtn.onclick = ()=>{
        const headers = ["วันที่", "ประเภทอุปกรณ์", "ขนาดพิกัด", "รหัสอุปกรณ์", "พื้นที่/สายป้อน", "ทีม", "ช่างผู้รับผิดชอบ", "ชม.แรงงาน", "ค่าพัสดุ", "ค่าแรง", "ค่าใช้จ่ายอื่น", "รวมต้นทุน", "ประเภทงาน", "สถานะ", "หมายเหตุ"];
        const rows = STATE.pmRecords.map(r => [
          r.date, r.equipmentType, r.capacity||"-", r.equipmentId, r.location, r.team, r.technician,
          r.laborHours, r.materialCost, r.laborCost, r.otherCost,
          (Number(r.materialCost)+Number(r.laborCost)+Number(r.otherCost)),
          r.maintenanceType, r.status, r.notes
        ]);
        exportToExcel("MEA_PM_Records_300_" + new Date().toISOString().slice(0,10), "PM_Records", [headers, ...rows]);
      };
    }

    const importBtn = document.getElementById("import-pm-btn");
    if(importBtn) importBtn.onclick = () => triggerExcelImport("pm");

    document.querySelectorAll("[data-del-pm]").forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.getAttribute("data-del-pm");
        if(confirm("ยืนยันการลบรายการนี้ใช่หรือไม่?")) persist({ ...STATE, pmRecords: STATE.pmRecords.filter(r=>r.id!==id) });
      };
    });
  }

  if(TAB==="plan"){
    const planTypeSelect = document.getElementById("p-equipmentType");
    if(planTypeSelect){
      planTypeSelect.onchange = () => {
        const selectedType = planTypeSelect.value;
        const capSelect = document.getElementById("p-capacity");
        if(capSelect && CAPACITY_OPTIONS[selectedType]){
          capSelect.innerHTML = CAPACITY_OPTIONS[selectedType].map(c=>`<option>${c}</option>`).join("");
        }
      };
    }

    const form = document.getElementById("plan-form");
    if(form){
      form.onsubmit = (e)=>{
        e.preventDefault();
        const val = id => document.getElementById(id).value;
        const record = {
          equipmentType: val("p-equipmentType"), capacity: val("p-capacity"), equipmentId: val("p-equipmentId"), location: val("p-location"),
          plannedDate: val("p-plannedDate"), team: val("p-team"), priority: val("p-priority"), status:"วางแผน", id: uid(),
        };
        planForm = emptyPlan(); persist({ ...STATE, planRecords: [record, ...STATE.planRecords] });
      };
    }

    const exportPlanBtn = document.getElementById("export-plan-excel-btn");
    if(exportPlanBtn){
      exportPlanBtn.onclick = ()=>{
        const headers = ["วันที่วางแผน", "ประเภทอุปกรณ์", "ขนาดพิกัด", "รหัสอุปกรณ์", "พื้นที่/สายป้อน", "ทีมที่รับผิดชอบ", "ความสำคัญ", "สถานะ"];
        const rows = STATE.planRecords.map(r => [r.plannedDate, r.equipmentType, r.capacity||"-", r.equipmentId, r.location, r.team, r.priority, r.status]);
        exportToExcel("MEA_PM_Plans_" + new Date().toISOString().slice(0,10), "PM_Plans", [headers, ...rows]);
      };
    }

    document.querySelectorAll("[data-convert-plan]").forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.getAttribute("data-convert-plan");
        const plan = STATE.planRecords.find(p=>p.id===id);
        if(plan){
          pmForm = { ...emptyPm(), equipmentType: plan.equipmentType, capacity: plan.capacity, equipmentId: plan.equipmentId, location: plan.location, team: plan.team, date: plan.plannedDate };
          TAB = "entry"; render();
        }
      };
    });

    document.querySelectorAll("[data-del-plan]").forEach(btn=>{
      btn.onclick = ()=>{
        const id = btn.getAttribute("data-del-plan");
        if(confirm("ยืนยันการลบแผนงานนี้ใช่หรือไม่?")) persist({ ...STATE, planRecords: STATE.planRecords.filter(r=>r.id!==id) });
      };
    });
  }

  if(TAB==="cost"){
    document.querySelectorAll("[data-benchmark]").forEach(inp=>{
      inp.onchange = ()=>{
        const type = inp.getAttribute("data-benchmark");
        persist({ ...STATE, benchmarks: { ...STATE.benchmarks, [type]: Number(inp.value)||0 } });
      };
    });

    const exportCostBtn = document.getElementById("export-cost-excel-btn");
    if(exportCostBtn){
      exportCostBtn.onclick = ()=>{
        const headers = ["ประเภทอุปกรณ์", "จำนวนงานที่ทำ", "ต้นทุนจริงรวม (บาท)", "ต้นทุนเฉลี่ย/งาน (บาท)", "เกณฑ์มาตรฐาน WCM (บาท)", "ส่วนต่าง (%)"];
        const rows = EQUIPMENT_TYPES.map(t=>{
          const recs = STATE.pmRecords.filter(r=>r.equipmentType===t);
          const totalCost = recs.reduce((s,r)=>s+Number(r.materialCost)+Number(r.laborCost)+Number(r.otherCost),0);
          const avg = recs.length ? totalCost/recs.length : 0;
          const bench = STATE.benchmarks[t]||0;
          const variance = bench ? (avg-bench)/bench*100 : 0;
          return [t, recs.length, totalCost, avg, bench, variance.toFixed(2) + "%"];
        });
        exportToExcel("MEA_WCM_Cost_Analysis_" + new Date().toISOString().slice(0,10), "Cost_Analysis", [headers, ...rows]);
      };
    }
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
