<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>MEA PM Planner — กฟน. เขตสมุทรปราการ</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');

  :root{
    --navy: #091E36; --navy-dark: #051324; --navy-light: #133358;
    --electric: #0088FF; --electric-glow: rgba(0, 136, 255, 0.35);
    --blue-soft: #EBF4FE; --amber: #F59E0B; --amber-soft: #FEF3C7;
    --green: #10B981; --green-soft: #D1FAE5; --red: #EF4444; --red-soft: #FEE2E2;
    --purple: #8B5CF6; --purple-soft: #EDE9FE; --bg: #F0F4F9;
    --surface: #FFFFFF; --border: #E2E8F0; --text: #0F172A; --muted: #64748B;
    --bottom-nav-height: 66px; --radius: 16px;
    --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans Thai','Plus Jakarta Sans',sans-serif;
    background:var(--bg); color:var(--text);
  }
  #app{ width:100%; min-height:100vh; display:flex; flex-direction:column; }
  .shell{ display:flex; flex-direction:column; min-height:100vh; width:100%; }
  @media(min-width:768px){ .shell{ flex-direction:row; } }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px;
    box-shadow:var(--shadow-sm);
  }

  /* Login Card */
  .login-container{
    display:flex; align-items:center; justify-content:center; min-height:100vh; width:100%; padding:20px;
    background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 50%, #154374 100%);
  }
  .login-card{
    background:#fff; border-radius:24px; padding:36px; width:100%; max-width:420px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  }

  /* Topbar Mobile */
  .mobile-topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--navy); padding:14px 18px; color:#fff;
  }
  @media(min-width:768px){ .mobile-topbar{ display:none; } }

  /* Desktop Sidebar */
  .sidebar{
    background:var(--navy); padding:24px 18px; display:none; width:270px; flex-direction:column; flex-shrink:0;
  }
  @media(min-width:768px){ .sidebar{ display:flex; } }
  .brand{ display:flex; align-items:center; gap:12px; margin-bottom:24px; padding:0 6px; }
  .brand-icon{
    width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg, var(--electric), #005cb3);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff; font-weight:bold;
  }
  .brand-title{ color:#fff; font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:16px; }
  .brand-sub{ color:#94A3B8; font-size:11px; margin-top:2px; }

  .user-badge{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,0.06); padding:10px 14px; border-radius:12px; margin-bottom:20px;
    border:1px solid rgba(255,255,255,0.08);
  }
  .user-badge-role{ font-size:13px; font-weight:600; color:#fff; }
  .user-badge-tag{ font-size:10px; font-weight:700; padding:3px 8px; border-radius:6px; background:var(--electric); color:#fff; }

  .nav-btn{
    display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px;
    font-size:14px; font-weight:500; color:#94A3B8; background:transparent;
    border:none; cursor:pointer; text-align:left; font-family:inherit; transition:0.2s;
  }
  .nav-btn:hover{ background:rgba(255,255,255,0.06); color:#fff; }
  .nav-btn.active{
    background:linear-gradient(135deg, var(--electric), #0066CC); color:#fff; font-weight:600;
  }

  /* Bottom Navigation */
  .bottom-nav{
    position:fixed; bottom:0; left:0; width:100%; height:var(--bottom-nav-height);
    background:rgba(9, 30, 54, 0.98); backdrop-filter:blur(16px);
    display:flex; align-items:center; justify-content:space-around;
    z-index:900; border-top:1px solid rgba(255,255,255,0.1); padding-bottom:env(safe-area-inset-bottom);
  }
  @media(min-width:768px){ .bottom-nav{ display:none; } }
  .b-nav-item{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; background:none; border:none; color:#94A3B8; font-size:10px; font-family:inherit;
    flex:1; height:100%; cursor:pointer; padding:4px 0;
  }
  .b-nav-item.active{ color:#00D2FF; font-weight:700; }

  /* Main Area */
  .main{
    flex:1; padding:20px 16px; overflow-y:auto;
    padding-bottom:calc(var(--bottom-nav-height) + 30px);
  }
  @media(min-width:768px){ .main{ padding:36px; padding-bottom:36px; } }

  h2.section-title{ font-family:'Plus Jakarta Sans','Noto Sans Thai',sans-serif; font-size:22px; font-weight:800; color:var(--navy); margin:0; }
  .section-desc{ font-size:13px; color:var(--muted); margin:4px 0 0; }
  .section-header{ margin-bottom:20px; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px; }
  .header-actions{ display:flex; gap:8px; flex-wrap:wrap; width:100%; }
  @media(min-width:640px){ .header-actions{ width:auto; } }

  /* KPI Grid */
  .kpi-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:24px; }
  @media(min-width:1024px){ .kpi-grid{ grid-template-columns:repeat(4,1fr); gap:18px; } }

  .kpi-card{
    display:flex; flex-direction:column; gap:8px; border-left:4px solid var(--electric);
    cursor:pointer;
  }
  .kpi-card.green{ border-left-color: var(--green); }
  .kpi-card.amber{ border-left-color: var(--amber); }
  .kpi-card.red{ border-left-color: var(--red); }

  .kpi-top{ display:flex; align-items:center; justify-content:space-between; }
  .kpi-label{ font-size:13px; font-weight:600; color:var(--muted); }
  .kpi-icon{ border-radius:10px; padding:8px; display:flex; }
  .kpi-value{ font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:700; color:var(--navy); }
  @media(min-width:640px){ .kpi-value{ font-size:28px; } }
  .kpi-sub{ font-size:11px; color:var(--muted); }

  #map-container{ height: 420px; width: 100%; border-radius: 14px; z-index: 1; border: 1px solid var(--border); }

  /* Formula Box */
  .formula-btn{
    display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600;
    color:var(--electric); background:var(--blue-soft); padding:4px 10px; border-radius:8px;
    cursor:pointer; border:1px solid #BFDBFE;
  }
  .formula-box{
    background:#0F172A; color:#E2E8F0; padding:16px; border-radius:12px;
    font-family:'JetBrains Mono', monospace; font-size:13px; line-height:1.7;
    margin:12px 0; border:1px solid #334155;
  }

  /* Charts */
  .chart-grid{ display:grid; grid-template-columns:1fr; gap:18px; margin-bottom:24px; }
  @media(min-width:1024px){ .chart-grid{ grid-template-columns:1fr 1fr; } }
  .chart-card h3{ font-size:15px; font-weight:700; color:var(--navy); margin:0 0 16px; }
  .chart-wrap{ height:300px; position:relative; width:100%; }

  /* Forms & Toolbar */
  .toolbar{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .toolbar input, .toolbar select{
    padding:10px 14px; border:1px solid var(--border); border-radius:10px; font-size:13px; font-family:inherit; background:var(--surface); flex:1; min-height:44px;
  }
  form.entry-form{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; display:grid; grid-template-columns:1fr; gap:16px; margin-bottom:24px; box-shadow:var(--shadow-sm); }
  @media(min-width:640px){ form.entry-form{ grid-template-columns:1fr 1fr; } }
  @media(min-width:1024px){ form.entry-form{ grid-template-columns:1fr 1fr 1fr; } }
  .field{ display:flex; flex-direction:column; gap:6px; font-size:13px; }
  .field-label{ color:var(--muted); font-weight:600; font-size:12px; }
  .field input, .field select, .field textarea{ width:100%; border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:14px; outline:none; background:var(--surface); color:var(--text); font-family:inherit; transition:.15s; min-height:44px; }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--electric); }
  .span-all{ grid-column:1/-1; }
  .form-actions{ grid-column:1/-1; display:flex; justify-content:flex-end; gap:10px; }

  .btn-primary{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:10px; padding:12px 20px; font-size:14px; font-weight:600; color:#fff; background:linear-gradient(135deg, var(--electric), #0066CC); cursor:pointer; font-family:inherit; transition:0.2s; min-height:44px; width:100%; }
  @media(min-width:640px){ .btn-primary{ width:auto; } }
  .btn-secondary{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--border); border-radius:10px; padding:10px 16px; font-size:13px; font-weight:600; color:var(--text); background:var(--surface); cursor:pointer; font-family:inherit; transition:0.2s; min-height:42px; }
  .btn-success{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:10px; padding:10px 16px; font-size:13px; font-weight:600; color:#fff; background:linear-gradient(135deg, #10B981, #059669); cursor:pointer; font-family:inherit; transition:0.2s; min-height:42px
