<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>MEA PM Planner — กฟน. เขตสมุทรปราการ</title>

<!-- Chart.js & SheetJS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- Leaflet Map CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');

  :root{
    --navy: #091E36; --navy-dark: #051324; --navy-light: #133358;
    --electric: #0088FF; --electric-glow: rgba(0, 136, 255, 0.35);
    --blue-soft: #EBF4FE; --amber: #F59E0B; --amber-soft: #FEF3C7;
    --green: #10B981; --green-soft: #D1FAE5; --red: #EF4444; --red-soft: #FEE2E2;
    --purple: #8B5CF6; --purple-soft: #EDE9FE; --bg: #F0F4F9;
    --surface: #FFFFFF; --surface-glass: rgba(255, 255, 255, 0.9);
    --border: #E2E8F0; --text: #0F172A; --muted: #64748B;
    --bottom-nav-height: 66px; --radius: 16px;
    --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans Thai','Plus Jakarta Sans',sans-serif;
    background:var(--bg); color:var(--text);
  }
  #app{ width:100%; min-height:100vh; display:flex; flex-direction:column; }
  .shell{ display:flex; flex-direction:column; min-height:100vh; width:100%; }
  @media(min-width:768px){ .shell{ flex-direction:row; } }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px;
    box-shadow:var(--shadow-sm); transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:hover{ box-shadow:var(--shadow-md); }

  /* Login Card */
  .login-container{
    display:flex; align-items:center; justify-content:center; min-height:100vh; width:100%; padding:20px;
    background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 50%, #154374 100%);
  }
  .login-card{
    background:#fff; border-radius:24px; padding:36px; width:100%; max-width:420px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  }

  /* Topbar Mobile */
  .mobile-topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--navy); padding:14px 18px; color:#fff;
  }
  @media(min-width:768px){ .mobile-topbar{ display:none; } }

  /* Desktop Sidebar */
  .sidebar{
    background:var(--navy); padding:24px 18px; display:none; width:270px; flex-direction:column; flex-shrink:0;
  }
  @media(min-width:768px){ .sidebar{ display:flex; } }
  .brand{ display:flex; align-items:center; gap:12px; margin-bottom:24px; padding:0 6px; }
  .brand-icon{
    width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg, var(--electric), #005cb3);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff; font-weight:bold;
  }
  .brand-title{ color:#fff; font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:16px; }
  .brand-sub{ color:#94A3B8; font-size:11px; margin-top:2px; }

  .user-badge{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,0.06); padding:10px 14px; border-radius:12px; margin-bottom:20px;
    border:1px solid rgba(255,255,255,0.08);
  }
  .user-badge-role{ font-size:13px; font-weight:600; color:#fff; }
  .user-badge-tag{ font-size:10px; font-weight:700; padding:3px 8px; border-radius:6px; background:var(--electric); color:#fff; }

  .nav-btn{
    display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px;
    font-size:14px; font-weight:500; color:#94A3B8; background:transparent;
    border:none; cursor:pointer; text-align:left; font-family:inherit; transition:0.2s;
  }
  .nav-btn:hover{ background:rgba(255,255,255,0.06); color:#fff; transform:translateX(3px); }
  .nav-btn.active{
    background:linear-gradient(135deg, var(--electric), #0066CC); color:#fff; font-weight:600;
  }

  /* Bottom Navigation */
  .bottom-nav{
    position:fixed; bottom:0; left:0; width:100%; height:var(--bottom-nav-height);
    background:rgba(9, 30, 54, 0.98); backdrop-filter:blur(16px);
    display:flex; align-items:center; justify-content:space-around;
    z-index:900; border-top:1px solid rgba(255,255,255,0.1); padding-bottom:env(safe-area-inset-bottom);
  }
  @media(min-width:768px){ .bottom-nav{ display:none; } }
  .b-nav-item{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; background:none; border:none; color:#94A3B8; font-size:10px; font-family:inherit;
    flex:1; height:100%; cursor:pointer; padding:4px 0; transition:0.15s;
  }
  .b-nav-item.active{ color:#00D2FF; font-weight:700; }

  /* Main Area */
  .main{
    flex:1; padding:20px 16px; overflow-y:auto;
    padding-bottom:calc(var(--bottom-nav-height) + 30px);
  }
  @media(min-width:768px){ .main{ padding:36px; padding-bottom:36px; } }

  h2.section-title{ font-family:'Plus Jakarta Sans','Noto Sans Thai',sans-serif; font-size:22px; font-weight:800; color:var(--navy); margin:0; }
  .section-desc{ font-size:13px; color:var(--muted); margin:4px 0 0; }
  .section-header{ margin-bottom:20px; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px; }
  .header-actions{ display:flex; gap:8px; flex-wrap:wrap; width:100%; }
  @media(min-width:640px){ .header-actions{ width:auto; } }

  /* KPI Grid */
  .kpi-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:24px; }
  @media(min-width:1024px){ .kpi-grid{ grid-template-columns:repeat(4,1fr); gap:18px; } }

  .kpi-card{
    display:flex; flex-direction:column; gap:8px; border-left:4px solid var(--electric);
    cursor:pointer; position:relative; overflow:hidden;
  }
  .kpi-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-md); }
  .kpi-card.green{ border-left-color: var(--green); }
  .kpi-card.amber{ border-left-color: var(--amber); }
  .kpi-card.red{ border-left-color: var(--red); }

  .kpi-top{ display:flex; align-items:center; justify-content:space-between; }
  .kpi-label{ font-size:13px; font-weight:600; color:var(--muted); }
  .kpi-icon{ border-radius:10px; padding:8px; display:flex; }
  .kpi-value{ font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:700; color:var(--navy); }
  @media(min-width:640px){ .kpi-value{ font-size:28px; } }
  .kpi-sub{ font-size:11px; color:var(--muted); }

  #map-container{ height: 420px; width: 100%; border-radius: 14px; z-index: 1; border: 1px solid var(--border); }

  /* Formula Box */
  .formula-btn{
    display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600;
    color:var(--electric); background:var(--blue-soft); padding:4px 10px; border-radius:8px;
    cursor:pointer; border:1px solid #BFDBFE; text-decoration:none;
  }
  .formula-btn:hover{ background:var(--electric); color:#fff; }
  .formula-box{
    background:#0F172A; color:#E2E8F0; padding:16px; border-radius:12px;
    font-family:'JetBrains Mono', monospace; font-size:13px; line-height:1.7;
    margin:12px 0; border:1px solid #334155;
  }

  /* Charts */
  .chart-grid{ display:grid; grid-template-columns:1fr; gap:18px; margin-bottom:24px; }
  @media(min-width:1024px){ .chart-grid{ grid-template-columns:1fr 1fr; } }
  .chart-card h3{ font-size:15px; font-weight:700; color:var(--navy); margin:0 0 16px; }
  .chart-wrap{ height:300px; position:relative; width:100%; }

  /* Forms & Toolbar */
  .toolbar{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .toolbar input, .toolbar select{
    padding:10px 14px; border:1px solid var(--border); border-radius:10px; font-size:13px; font-family:inherit; background:var(--surface); flex:1; min-height:44px;
  }
  form.entry-form{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; display:grid; grid-template-columns:1fr; gap:16px; margin-bottom:24px; box-shadow:var(--shadow-sm); }
  @media(min-width:640px){ form.entry-form{ grid-template-columns:1fr 1fr; } }
  @media(min-width:1024px){ form.entry-form{ grid-template-columns:1fr 1fr 1fr; } }
  .field{ display:flex; flex-direction:column; gap:6px; font-size:13px; }
  .field-label{ color:var(--muted); font-weight:600; font-size:12px; }
  .field input, .field select, .field textarea{ width:100%; border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:14px; outline:none; background:var(--surface); color:var(--text); font-family:inherit; transition:.15s; min-height:44px; }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--electric); box-shadow:0 0 0 3px var(--electric-glow); }
  .span-all{ grid-column:1/-1; }
  .form-actions{ grid-column:1/-1; display:flex; justify-content:flex-end; gap:10px; }

  .btn-primary{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:10px; padding:12px 20px; font-size:14px; font-weight:600; color:#fff; background:linear-gradient(135deg, var(--electric), #0066CC); cursor:pointer; font-family:inherit; transition:0.2s; min-height:44px; width:100%; }
  @media(min-width:640px){ .btn-primary{ width:auto; } }
  .btn-secondary{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--border); border-radius:10px; padding:10px 16px; font-size:13px; font-weight:600; color:var(--text); background:var(--surface); cursor:pointer; font-family:inherit; transition:0.2s; min-height:42px; }
  .btn-success{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:10px; padding:10px 16px; font-size:13px; font-weight:600; color:#fff; background:linear-gradient(135deg, #10B981, #059669); cursor:pointer; font-family:inherit; transition:0.2s; min-height:42px; }

  /* Mobile Record List */
  .mobile-record-list{ display:flex; flex-direction:column; gap:12px; }
  @media(min-width:768px){ .mobile-record-list{ display:none; } }
  .m-record-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow-sm);
  }
  .m-card-id{ font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--electric); font-size:15px; }

  /* Desktop Table */
  .desktop-table-wrap{ display:none; overflow-x:auto; }
  @media(min-width:768px){ .desktop-table-wrap{ display:block; } }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; padding:12px 14px 12px 0; font-weight:700; color:var(--muted); border-bottom:2px solid var(--border); white-space:nowrap; }
  td{ padding:14px 14px 14px 0; border-bottom:1px solid var(--border); white-space:nowrap; vertical-align:middle; }
  .mono{ font-family:'JetBrains Mono',monospace; }

  .pill{ display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:4px 10px; font-size:11px; font-weight:600; }
  .capacity-pill{ display:inline-flex; align-items:center; border-radius:6px; padding:2px 8px; font-size:11px; font-weight:700; font-family:'JetBrains Mono',monospace; background:var(--purple-soft); color:var(--purple); border:1px solid #DDD6FE; }
  
  .btn-sm{ padding:6px 12px; font-size:12px; border-radius:8px; border:1px solid var(--electric); background:var(--blue-soft); color:var(--electric); cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; justify-content:center; font-weight:600; min-height:34px; }
  .btn-sm:hover{ background:var(--electric); color:#fff; }

  .bench-grid{ display:grid; grid-template-columns:1fr; gap:12px; margin-bottom:20px; }
  @media(min-width:640px){ .bench-grid{ grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px; } }
  .bench-label{ font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px; }

  .modal-backdrop{
    position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(9,30,54,0.7);
    display:flex; align-items:flex-end; justify-content:center; z-index:9999; padding:0; backdrop-filter:blur(4px);
  }
  @media(min-width:640px){ .modal-backdrop{ align-items:center; padding:20px; } }
  .modal-card{
    background:var(--surface); border-radius:24px 24px 0 0; width:100%; max-width:680px;
    max-height:88vh; overflow-y:auto; padding:24px; box-shadow:var(--shadow-lg);
  }
  @media(min-width:640px){ .modal-card{ border-radius:20px; } }

  @media print {
    body { background: #fff !important; color: #000 !important; font-size: 11pt; }
    .sidebar, .toolbar, .form-actions, form, .btn-sm, .header-actions, .status-select, button, .modal-backdrop, .bottom-nav, .mobile-topbar { display: none !important; }
    .main { padding: 0 !important; }
    .card { border: none !important; box-shadow: none !important; padding: 0 !important; }
    .chart-grid, #map-container { display: none !important; }
    .desktop-table-wrap { display: block !important; }
    .mobile-record-list { display: none !important; }
    table { width: 100% !important; border-collapse: collapse !important; margin-top: 10px; }
    th, td { border: 1px solid #ccc !important; padding: 6px 8px !important; }
  }

  svg.ic{ display:block; }
</style>
</head>
<body>

<div id="modal-root"></div>
<div id="kpi-modal-root"></div>
<div id="formula-modal-root"></div>
<input type="file" id="excel-importer" accept=".xlsx, .xls, .csv" style="display:none;" />

function generateSafeRecords(){
  const today = new Date();
  const iso = (off) => { const d = new Date(today); d.setDate(d.getDate() + off); return d.toISOString().slice(0,10); };
  const benchmarks = { "หม้อแปลงจำหน่าย": 8500, "LBS": 4200, "UNIT SUBSTATION": 12500, "รีโคลสเซอร์ (Recloser)": 6500, "ดรอปเอาท์ฟิวส์": 2500 };
  const typePrefix = { "หม้อแปลงจำหน่าย":"TR-SP-", "LBS":"LBS-SP-", "UNIT SUBSTATION":"US-SP-", "รีโคลสเซอร์ (Recloser)":"RC-SP-", "ดรอปเอาท์ฟิวส์":"DF-SP-" };

  const pmRecords = [];
  for (let i = 1; i <= 300; i++) {
    const eqType = EQUIPMENT_TYPES[i % EQUIPMENT_TYPES.length];
    const capList = CAPACITY_OPTIONS[eqType];
    const capacity = capList[i % capList.length];
    const tech = TECHNICIANS[i % TECHNICIANS.length];
    const loc = LOCATIONS_LIST[i % LOCATIONS_LIST.length];
    const bench = benchmarks[eqType];
    const varianceFactor = 0.8 + ((i % 7) * 0.06);
    const totalCalc = Math.round(bench * varianceFactor);
    const materialCost = Math.round(totalCalc * 0.55);
    const laborCost = Math.round(totalCalc * 0.35);
    const otherCost = totalCalc - materialCost - laborCost;

    pmRecords.push({
      id: "PM-SP-" + (1000 + i),
      date: iso(-Math.floor(i * 0.3)),
      equipmentType: eqType,
      capacity: capacity,
      equipmentId: typePrefix[eqType] + String(100 + i).padStart(4, '0'),
      location: loc,
      team: tech.team,
      technician: tech.name,
      laborHours: +(2.5 + (i % 5) * 1.0).toFixed(1),
      materialCost: materialCost,
      laborCost: laborCost,
      otherCost: otherCost,
      maintenanceType: (i % 10 === 0) ? "แก้ไข" : "ป้องกัน",
      status: i <= 285 ? "เสร็จสิ้น" : (i <= 295 ? "ระหว่างดำเนินการ" : "รอดำเนินการ"),
      notes: `ตรวจเช็คตามรอบ PM ปกติ Health Index ${Math.round(98 - (i % 20))}%`,
      photo: ""
    });
  }

  const planRecords = [];
  for (let j = 1; j <= 50; j++) {
    const eqType = EQUIPMENT_TYPES[(j * 2) % EQUIPMENT_TYPES.length];
    const capList = CAPACITY_OPTIONS[eqType];
    const capacity = capList[(j * 2) % capList.length];
    const tech = TECHNICIANS[(j * 3) % TECHNICIANS.length];
    const loc = LOCATIONS_LIST[(j * 2) % LOCATIONS_LIST.length];

    planRecords.push({
      id: "PLAN-SP-" + (500 + j),
      equipmentType: eqType,
      capacity: capacity,
      equipmentId: typePrefix[eqType] + String(500 + j).padStart(4, '0'),
      location: loc,
      plannedDate: iso(Math.floor(j * 0.5) + 1),
      team: tech.team,
      priority: (j % 3 === 0) ? "สูง" : ((j % 2 === 0) ? "กลาง" : "ต่ำ"),
      status: (j % 15 === 0) ? "เลื่อน" : "วางแผน"
    });
  }

  return { benchmarks, pmRecords, planRecords };
}

function init(){
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    STATE = saved ? JSON.parse(saved) : generateSafeRecords();
    const auth = localStorage.getItem(AUTH_KEY);
    if(auth) CURRENT_USER = JSON.parse(auth);
  } catch(e) {
    STATE = generateSafeRecords();
  }
  render();
}

function persist(next){
  STATE = next;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); } catch(e){}
  render();
}

function triggerExcelImport(target) {
  IMPORT_TARGET = target;
  const fileInput = document.getElementById("excel-importer");
  if (fileInput) { fileInput.value = ""; fileInput.click(); }
}

function handleFileImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
      if (rows.length < 2) return;

      if (IMPORT_TARGET === "pm") {
        const imported = [];
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r || !r[1] || !r[3]) continue;
          imported.push({
            id: uid(),
            date: r[0] ? String(r[0]).slice(0,10) : new Date().toISOString().slice(0,10),
            equipmentType: r[1] || EQUIPMENT_TYPES[0],
            capacity: r[2] || CAPACITY_OPTIONS[r[1]||EQUIPMENT_TYPES[0]][0],
            equipmentId: String(r[3]),
            location: r[4] || "",
            team: r[5] || "ทีม A",
            technician: r[6] || "",
            laborHours: Number(r[7]) || 0,
            materialCost: Number(r[8]) || 0,
            laborCost: Number(r[9]) || 0,
            otherCost: Number(r[10]) || 0,
            maintenanceType: r[12] || "ป้องกัน",
            status: r[13] || "เสร็จสิ้น",
            notes: r[14] || "นำเข้าจาก Excel",
            photo: ""
          });
        }
        if(imported.length){
          persist({ ...STATE, pmRecords: [...imported, ...STATE.pmRecords] });
          alert(`นำเข้าสำเร็จ ${imported.length} รายการ`);
        }
      } else if (IMPORT_TARGET === "plan") {
        const imported = [];
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r || !r[1] || !r[3]) continue;
          imported.push({
            id: uid(),
            plannedDate: r[0] ? String(r[0]).slice(0,10) : new Date().toISOString().slice(0,10),
            equipmentType: r[1] || EQUIPMENT_TYPES[0],
            capacity: r[2] || CAPACITY_OPTIONS[r[1]||EQUIPMENT_TYPES[0]][0],
            equipmentId: String(r[3]),
            location: r[4] || "",
            team: r[5] || "ทีม A",
            priority: r[6] || "กลาง",
            status: r[7] || "วางแผน"
          });
        }
        if(imported.length){
          persist({ ...STATE, planRecords: [...imported, ...STATE.planRecords] });
          alert(`นำเข้าแผนงานสำเร็จ ${imported.length} รายการ`);
        }
      }
    } catch(err) { alert("เกิดข้อผิดพลาดในการอ่านไฟล์"); }
  };
  reader.readAsArrayBuffer(file);
}

function exportToExcel(filename, sheetName, dataArray) {
  if (typeof XLSX === 'undefined') return alert("ระบบกำลังโหลดโมดูล Excel");
  const ws = XLSX.utils.aoa_to_sheet(dataArray);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, filename + ".xlsx");
}

function showFormulaModal(formulaType) {
  const root = document.getElementById("formula-modal-root");
  if (!root) return;
  let title = "", formulaHtml = "";

  if (formulaType === "health_index") {
    title = "สูตรคำนวณ Health Index (HI %)";
    formulaHtml = `<div class="formula-box">Health Index (%) = ( Σ (Score_i × Weight_i) / Σ Max_Score ) × 100<br><br>• ฉนวนน้ำมัน (DGA) = 40%<br>• ค่า Megger ขดลวด = 30%<br>• ตรวจความร้อน Thermoscan = 20%<br>• สภาพกายภาพภายนอก = 10%</div>`;
  } else if (formulaType === "productivity") {
    title = "สูตรคำนวณ Labor Productivity";
    formulaHtml = `<div class="formula-box">Labor Productivity = งาน PM ที่เสร็จสิ้น (Tasks) / ชั่วโมงแรงงานรวม (Hours)<br><br>เกณฑ์มาตรฐาน WCM: 0.20 - 0.35 งาน/ชม.</div>`;
  } else if (formulaType === "variance") {
    title = "สูตรคำนวณ WCM Cost Variance (%)";
    formulaHtml = `<div class="formula-box">Cost Variance (%) = [ (ต้นทุนจริงเฉลี่ย - มาตรฐาน WCM) / มาตรฐาน WCM ] × 100</div>`;
  }

  root.innerHTML = `
    <div class="modal-backdrop" id="formula-modal-backdrop">
      <div class="modal-card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;border-bottom:1px solid var(--border);padding-bottom:10px;">
          <h3 style="font-size:16px;font-weight:800;color:var(--navy);margin:0;">${title}</h3>
          <button class="close-modal" onclick="closeFormulaModal()">&times;</button>
        </div>
        ${formulaHtml}
        <div style="text-align:right;margin-top:14px;"><button class="btn-secondary" onclick="closeFormulaModal()">ปิด</button></div>
      </div>
    </div>
  `;
}

function drawDashboardCharts(){
  const {pmRecords, benchmarks} = STATE;
  const costCtx = document.getElementById("costChart");
  if(costCtx && typeof Chart !== 'undefined'){
    if(CHARTS.cost) CHARTS.cost.destroy();

    // สร้าง Gradient สีสวยแบบ Modern FinTech
    const ctx = costCtx.getContext('2d');
    const gradActual = ctx.createLinearGradient(0, 0, 0, 300);
    gradActual.addColorStop(0, '#0088FF');
    gradActual.addColorStop(1, '#0055AA');

    const gradBench = ctx.createLinearGradient(0, 0, 0, 300);
    gradBench.addColorStop(0, '#F59E0B');
    gradBench.addColorStop(1, '#D97706');

    const costByType = EQUIPMENT_TYPES.map(t=>{
      const recs = pmRecords.filter(r=>r.equipmentType===t);
      const cost = recs.reduce((s,r)=>s+Number(r.materialCost)+Number(r.laborCost)+Number(r.otherCost),0);
      return { actual: recs.length ? Math.round(cost/recs.length) : 0, bench: benchmarks[t]||0 };
    });

    CHARTS.cost = new Chart(costCtx, {
      type:"bar",
      data:{
        labels: ["หม้อแปลง", "LBS", ["Unit", "Substation"], ["รีโคลสเซอร์", "(Recloser)"], "ดรอปเอาท์"],
        datasets:[
          { label:"ต้นทุนจริงเฉลี่ย", data: costByType.map(d=>d.actual), backgroundColor: gradActual, borderRadius: 8, barPercentage: 0.65 },
          { label:"เกณฑ์ WCM", data: costByType.map(d=>d.bench), backgroundColor: gradBench, borderRadius: 8, barPercentage: 0.65 }
        ]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        plugins:{
          legend:{
            position:"bottom",
            labels:{ font:{ family:"'Plus Jakarta Sans','Noto Sans Thai'", size:12, weight:'600' }, padding: 16, usePointStyle: true, pointStyle: 'circle' }
          },
          tooltip:{
            backgroundColor: 'rgba(9, 30, 54, 0.95)',
            titleFont: { family:"'Plus Jakarta Sans','Noto Sans Thai'", size:13, weight:'700' },
            bodyFont: { family:"'JetBrains Mono'", size:12 },
            padding: 12,
            cornerRadius: 10,
            callbacks: { label: (ctx) => ` ${ctx.dataset.label}: ${baht(ctx.parsed.y)}` }
          }
        },
        scales:{
          y:{
            grid:{ color: 'rgba(226, 232, 240, 0.6)', borderDash: [4, 4] },
            ticks:{ font:{ family:"'JetBrains Mono'", size:11 }, color: '#64748B', callback:(v)=>v.toLocaleString() }
          },
          x:{
            grid:{ display:false },
            ticks:{ font:{ family:"'Noto Sans Thai'", size:11, weight:'600' }, color: '#334155' }
          }
        }
      }
    });
  }

  const capCtx = document.getElementById("capacityChart");
  if(capCtx && typeof Chart !== 'undefined'){
    if(CHARTS.cap) CHARTS.cap.destroy();

    // จัดกลุ่มพิกัดหลัก 5 กลุ่มเด่นให้อ่านง่าย
    const capSummary = {
      "250-500 kVA (TR)": pmRecords.filter(r=>["250 kVA","315 kVA","400 kVA","500 kVA"].includes(r.capacity)).length,
      "1000-2000 kVA (Substation)": pmRecords.filter(r=>["1000 kVA (24kV)","1500 kVA (24kV)","2000 kVA (24kV)","1000 kVA"].includes(r.capacity)).length,
      "24 kV 630A (LBS/RC)": pmRecords.filter(r=>["24 kV 630A","24 kV 630A (12.5kA)"].includes(r.capacity)).length,
      "50-160 kVA (หม้อแปลงเล็ก)": pmRecords.filter(r=>["50 kVA","100 kVA","160 kVA"].includes(r.capacity)).length,
      "ฟิวส์ตัดตอน & พิกัดอื่น": pmRecords.filter(r=>["24 kV 100A","24 kV 200A","33 kV 100A","24 kV 1250A"].includes(r.capacity)).length,
    };

    CHARTS.cap = new Chart(capCtx, {
      type:"doughnut",
      data:{
        labels: Object.keys(capSummary),
        datasets:[{
          data: Object.values(capSummary),
          backgroundColor: [
            '#0088FF', // ไฟฟ้านีออน
            '#10B981', // เขียว Emerald
            '#8B5CF6', // ม่วง Modern
            '#F59E0B', // ส้ม Amber
            '#06B6D4'  // ฟ้า Cyan
          ],
          borderWidth: 4,
          borderColor: '#FFFFFF',
          hoverOffset: 8,
          spacing: 3
        }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        cutout: '70%',
        plugins:{
          legend:{
            position:"right",
            labels:{ font:{ family:"'Noto Sans Thai'", size:11, weight:'600' }, padding: 12, usePointStyle: true, boxWidth: 8 }
          },
          tooltip:{
            backgroundColor: 'rgba(9, 30, 54, 0.95)',
            titleFont: { family:"'Noto Sans Thai'", size:12, weight:'700' },
            bodyFont: { family:"'JetBrains Mono'", size:12 },
            padding: 12,
            cornerRadius: 10,
            callbacks: { label: (ctx) => ` จำนวน: ${ctx.parsed} รายการ (${Math.round(ctx.parsed/pmRecords.length*100)}%)` }
          }
        }
      }
    });
  }
}

function initMap(){
  const container = document.getElementById("map-container");
  if(!container || typeof L === 'undefined') return;
  if(LEAFLET_MAP) { LEAFLET_MAP.remove(); LEAFLET_MAP = null; }

  try {
    LEAFLET_MAP = L.map('map-container').setView(MEA_HQ_COORDS, 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(LEAFLET_MAP);
    L.marker(MEA_HQ_COORDS).addTo(LEAFLET_MAP).bindPopup('<b>กฟน. เขตสมุทรปราการ</b>').openPopup();

    Object.entries(LOCATIONS_COORDS).forEach(([loc, coords], idx) => {
      L.circleMarker(coords, { radius: 6, fillColor: C.blue, color: "#fff", weight: 2, fillOpacity: 0.9 })
        .addTo(LEAFLET_MAP).bindPopup(`<b>จุดตรวจที่ ${idx+1}</b><br>${loc}`);
    });
  } catch(e){}
}

function attachLoginListener(){
  const loginForm = document.getElementById("login-form");
  if(loginForm){
    loginForm.onsubmit = (e) => {
      e.preventDefault();
      const u = document.getElementById("l-user").value.trim().toLowerCase();
      const p = document.getElementById("l-pass").value.trim();
      if(u === "admin" && p === "admin123"){
        CURRENT_USER = { username: "admin", role: "admin", name: "วิศวกรหัวหน้างาน" };
        localStorage.setItem(AUTH_KEY, JSON.stringify(CURRENT_USER)); render();
      } else if(u === "tech" && p === "tech123"){
        CURRENT_USER = { username: "tech", role: "tech", name: "ช่างประจำเขต สป." };
        localStorage.setItem(AUTH_KEY, JSON.stringify(CURRENT_USER)); render();
      } else {
        LOGIN_ERROR = "Username หรือ Password ไม่ถูกต้อง"; render();
      }
    };
  }
}

function attachGlobalListeners(){
  document.querySelectorAll("[data-tab]").forEach(btn=>{
    btn.onclick = () => { TAB = btn.getAttribute("data-tab"); render(); };
  });

  const goGuideBtn = document.getElementById("go-guide-btn");
  if(goGuideBtn) goGuideBtn.onclick = () => { TAB = "guide"; render(); };

  const logoutHandler = () => { CURRENT_USER = null; localStorage.removeItem(AUTH_KEY); render(); };
  const logoutBtn = document.getElementById("logout-btn");
  if(logoutBtn) logoutBtn.onclick = logoutHandler;
  const mLogoutBtn = document.getElementById("m-logout-btn");
  if(mLogoutBtn) mLogoutBtn.onclick = logoutHandler;

  const mMoreBtn = document.getElementById("m-more-btn");
  if(mMoreBtn) mMoreBtn.onclick = () => { TAB = TAB === 'plan' ? 'cost' : (TAB === 'cost' ? 'kpi' : 'plan'); render(); };

  document.querySelectorAll("#print-pdf-btn").forEach(btn => {
    btn.onclick = () => window.print();
  });

  const fileImporter = document.getElementById("excel-importer");
  if (fileImporter) fileImporter.onchange = handleFileImport;
}

function attachTabListeners(){
  // Import Buttons
  const importPmBtn = document.getElementById("import-pm-btn");
  if(importPmBtn) importPmBtn.onclick = () => triggerExcelImport("pm");

  const importPlanBtn = document.getElementById("import-plan-btn");
  if(importPlanBtn) importPlanBtn.onclick = () => triggerExcelImport("plan");

  // Export Buttons
  const exportPmExcelBtn = document.getElementById("export-pm-excel-btn");
  if(exportPmExcelBtn){
    exportPmExcelBtn.onclick = () => {
      const headers = ["วันที่", "ประเภทอุปกรณ์", "ขนาดพิกัด", "รหัสอุปกรณ์", "พื้นที่/สายป้อน", "ทีม", "ผู้ปฏิบัติงาน", "ชม.แรงงาน", "ค่าพัสดุ", "ค่าแรง", "ค่าใช้จ่ายอื่น", "รวมต้นทุน", "ประเภทงาน", "สถานะ", "หมายเหตุ"];
      const rows = STATE.pmRecords.map(r => [
        r.date, r.equipmentType, r.capacity||"-", r.equipmentId, r.location, r.team, r.technician,
        r.laborHours, r.materialCost, r.laborCost, r.otherCost,
        (Number(r.materialCost)+Number(r.laborCost)+Number(r.otherCost)),
        r.maintenanceType, r.status, r.notes
      ]);
      exportToExcel("MEA_PM_Records_" + new Date().toISOString().slice(0,10), "PM_Records", [headers, ...rows]);
    };
  }

  const exportPlanExcelBtn = document.getElementById("export-plan-excel-btn");
  if(exportPlanExcelBtn){
    exportPlanExcelBtn.onclick = () => {
      const headers = ["วันที่วางแผน", "ประเภทอุปกรณ์", "ขนาดพิกัด", "รหัสอุปกรณ์", "พื้นที่/สายป้อน", "ทีม", "ความสำคัญ", "สถานะ"];
      const rows = STATE.planRecords.map(r => [r.plannedDate, r.equipmentType, r.capacity||"-", r.equipmentId, r.location, r.team, r.priority, r.status]);
      exportToExcel("MEA_PM_Plans_" + new Date().toISOString().slice(0,10), "PM_Plans", [headers, ...rows]);
    };
  }

  const exportCostExcelBtn = document.getElementById("export-cost-excel-btn");
  if(exportCostExcelBtn){
    exportCostExcelBtn.onclick = () => {
      const headers = ["ประเภทอุปกรณ์", "จำนวนงาน", "ต้นทุนจริงรวม (บาท)", "เกณฑ์มาตรฐาน WCM (บาท)"];
      const rows = EQUIPMENT_TYPES.map(t => [t, STATE.pmRecords.filter(r => r.equipmentType === t).length, STATE.benchmarks[t] || 0]);
      exportToExcel("MEA_WCM_Cost_" + new Date().toISOString().slice(0,10), "WCM_Cost", [headers, ...rows]);
    };
  }

  const exportKpiExcelBtn = document.getElementById("export-kpi-excel-btn");
  if(exportKpiExcelBtn){
    exportKpiExcelBtn.onclick = () => {
      const headers = ["ช่างผู้ปฏิบัติงาน", "ทีม", "งานที่เสร็จสิ้น"];
      const rows = TECHNICIANS.map(t => [t.name, t.team, STATE.pmRecords.filter(r => r.technician === t.name && r.status === "เสร็จสิ้น").length]);
      exportToExcel("MEA_KPI_" + new Date().toISOString().slice(0,10), "KPI", [headers, ...rows]);
    };
  }

  const exportDashboardExcelBtn = document.getElementById("export-dashboard-excel-btn");
  if(exportDashboardExcelBtn){
    exportDashboardExcelBtn.onclick = () => {
      const headers = ["ตัวชี้วัด", "ค่าปัจจุบัน"];
      const totalCost = STATE.pmRecords.reduce((s,r)=>s+Number(r.materialCost)+Number(r.laborCost)+Number(r.otherCost),0);
      const rows = [
        ["จำนวนงาน PM ทั้งหมด", STATE.pmRecords.length],
        ["งานที่เสร็จสิ้น", STATE.pmRecords.filter(r=>r.status==="เสร็จสิ้น").length],
        ["Health Index เฉลี่ย", "93.8%"],
        ["ต้นทุนจริงรวม (บาท)", totalCost],
        ["แผนงานค้าง", STATE.planRecords.length]
      ];
      exportToExcel("MEA_Dashboard_Summary_" + new Date().toISOString().slice(0,10), "Summary", [headers, ...rows]);
    };
  }

  const exportRoutesExcelBtn = document.getElementById("export-routes-excel-btn");
  if(exportRoutesExcelBtn){
    exportRoutesExcelBtn.onclick = () => {
      const headers = ["ลำดับ", "สายป้อน / พื้นที่", "พิกัดละติจูด", "พิกัดลองจิจูด"];
      const rows = Object.entries(LOCATIONS_COORDS).map(([loc, coords], idx) => [idx + 1, loc, coords[0], coords[1]]);
      exportToExcel("MEA_Routes_" + new Date().toISOString().slice(0,10), "Routes", [headers, ...rows]);
    };
  }

  // Type change handler for Capacity
  const fType = document.getElementById("f-equipmentType");
  if(fType){
    fType.onchange = () => {
      const capSelect = document.getElementById("f-capacity");
      if(capSelect && CAPACITY_OPTIONS[fType.value]){
        capSelect.innerHTML = CAPACITY_OPTIONS[fType.value].map(c => `<option>${c}</option>`).join("");
      }
    };
  }

  // Edit PM Form Actions
  document.querySelectorAll("[data-edit-pm]").forEach(btn=>{
    btn.onclick = () => {
      const id = btn.getAttribute("data-edit-pm");
      const item = STATE.pmRecords.find(r => r.id === id);
      if(item){ EDITING_RECORD = { type: "pm", data: { ...item } }; renderModal(); }
    };
  });

  const form = document.getElementById("pm-form");
  if(form){
    form.onsubmit = (e)=>{
      e.preventDefault();
      const record = {
        date: document.getElementById("f-date").value,
        equipmentType: document.getElementById("f-equipmentType").value,
        capacity: document.getElementById("f-capacity") ? document.getElementById("f-capacity").value : "-",
        equipmentId: document.getElementById("f-equipmentId").value,
        location: document.getElementById("f-location").value,
        team: document.getElementById("f-team").value,
        technician: CURRENT_USER?.name || "ช่างปฏิบัติงาน",
        laborHours: 3.0,
        materialCost: Number(document.getElementById("f-materialCost").value)||0,
        laborCost: Number(document.getElementById("f-laborCost").value)||0,
        otherCost: 0,
        maintenanceType: "ป้องกัน",
        status: "เสร็จสิ้น",
        notes: "บันทึกงานสำเร็จ",
        photo: "",
        id: uid()
      };
      persist({ ...STATE, pmRecords: [record, ...STATE.pmRecords] });
    };
  }
}

// Start Application
init();
</script>
</body>
</html>
