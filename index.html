<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEA PM Planner — เขตสมุทรปราการ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --navy:#0B2440; --navy-light:#123356; --blue:#2E7DD1; --blue-soft:#DCEAFB;
    --amber:#D99A34; --amber-soft:#F7E7CE; --green:#2E9E6D; --green-soft:#DDF0E7;
    --red:#C24A42; --red-soft:#F6DEDB; --bg:#F3F5F8; --surface:#FFFFFF;
    --border:#DFE4EA; --text:#152233; --muted:#647184;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans Thai','IBM Plex Sans',sans-serif;
    background:var(--bg); color:var(--text);
  }
  #app{ width:100%; }
  .shell{
    display:flex; flex-direction:column; min-height:720px;
    border:1px solid var(--border); border-radius:12px; overflow:hidden;
  }
  @media(min-width:768px){ .shell{ flex-direction:row; } }

  /* Sidebar */
  .sidebar{
    background:var(--navy); padding:20px; display:flex; gap:4px;
    overflow-x:auto; flex-shrink:0;
  }
  @media(min-width:768px){ .sidebar{ width:256px; flex-direction:column; } }
  .brand{ display:none; align-items:center; gap:8px; margin-bottom:24px; padding:0 4px; }
  @media(min-width:768px){ .brand{ display:flex; } }
  .brand-icon{
    width:32px; height:32px; border-radius:8px; background:var(--blue);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-title{ color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; line-height:1.3; }
  .brand-sub{ color:#8FA5C2; font-size:11px; }
  .nav-btn{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px;
    font-size:14px; font-weight:500; white-space:nowrap; color:#B6C4DA; background:transparent;
    border:none; cursor:pointer; text-align:left; font-family:inherit;
  }
  .nav-btn.active{ background:var(--blue); color:#fff; }
  .sidebar-footer{ display:none; margin-top:auto; padding-top:24px; }
  @media(min-width:768px){ .sidebar-footer{ display:block; } }
  .clear-btn{
    display:flex; align-items:center; gap:8px; font-size:12px; padding:8px 12px;
    border-radius:8px; color:#8FA5C2; border:1px solid #22406A; background:transparent; cursor:pointer;
    font-family:inherit;
  }
  .save-note{ font-size:11px; margin-top:12px; padding:0 4px; color:#5E7699; }

  /* Main */
  .main{ flex:1; padding:24px; overflow-y:auto; }
  @media(min-width:768px){ .main{ padding:32px; } }

  h2.section-title{
    font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:600; color:var(--navy); margin:0;
  }
  .section-desc{ font-size:14px; color:var(--muted); margin:4px 0 0; }
  .section-header{ margin-bottom:20px; }

  /* Grids */
  .kpi-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin-bottom:24px; }
  @media(min-width:1024px){ .kpi-grid{ grid-template-columns:repeat(4,1fr); } }
  .kpi-grid.kpi3{ grid-template-columns:repeat(2,1fr); }
  @media(min-width:1024px){ .kpi-grid.kpi3{ grid-template-columns:repeat(3,1fr); } }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .kpi-card{ display:flex; flex-direction:column; gap:8px; }
  .kpi-top{ display:flex; align-items:center; justify-content:space-between; }
  .kpi-label{ font-size:12px; font-weight:500; color:var(--muted); }
  .kpi-icon{ border-radius:6px; padding:6px; display:flex; }
  .kpi-value{ font-family:'IBM Plex Mono',monospace; font-size:24px; font-weight:600; color:var(--navy); }
  .kpi-sub{ font-size:12px; color:var(--muted); }

  .chart-grid{ display:grid; grid-template-columns:1fr; gap:20px; margin-bottom:24px; }
  @media(min-width:1024px){ .chart-grid{ grid-template-columns:1fr 1fr; } }
  .chart-card h3{ font-size:14px; font-weight:600; color:var(--navy); margin:0 0 12px; }
  .chart-wrap{ height:260px; }

  .empty-state{
    height:220px; display:flex; align-items:center; justify-content:center;
    font-size:14px; color:var(--muted); background:var(--bg); border-radius:8px;
  }

  /* Forms */
  form.entry-form{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px;
    display:grid; grid-template-columns:1fr; gap:16px; margin-bottom:32px;
  }
  @media(min-width:640px){ form.entry-form{ grid-template-columns:1fr 1fr; } }
  @media(min-width:1024px){ form.entry-form{ grid-template-columns:1fr 1fr 1fr; } }
  .field{ display:flex; flex-direction:column; gap:6px; font-size:14px; }
  .field-label{ color:var(--muted); font-weight:500; }
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--border); border-radius:6px; padding:8px 12px;
    font-size:14px; outline:none; background:var(--surface); color:var(--text);
    font-family:inherit; transition:.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft);
  }
  .span-all{ grid-column:1/-1; }
  .form-actions{ grid-column:1/-1; display:flex; justify-content:flex-end; }
  .btn-primary{
    display:flex; align-items:center; gap:8px; border:none; border-radius:8px;
    padding:10px 16px; font-size:14px; font-weight:500; color:#fff; background:var(--blue);
    cursor:pointer; font-family:inherit;
  }

  /* Tables */
  table{ width:100%; border-collapse:collapse; font-size:14px; }
  th{ text-align:left; padding:8px 16px 8px 0; font-weight:500; color:var(--muted); border-bottom:1px solid var(--border); white-space:nowrap; }
  td{ padding:10px 16px 10px 0; border-bottom:1px solid var(--border); white-space:nowrap; }
  .table-wrap{ overflow-x:auto; }
  .mono{ font-family:'IBM Plex Mono',monospace; }
  .muted{ color:var(--muted); }
  .status-select{ font-size:12px; border-radius:6px; border:1px solid var(--border); padding:4px 8px; font-family:inherit; }

  .pill{
    display:inline-flex; align-items:center; gap:4px; border-radius:999px;
    padding:4px 10px; font-size:12px; font-weight:500;
  }
  .icon-btn{ background:none; border:none; cursor:pointer; color:var(--red); display:flex; padding:2px; }

  .bench-grid{ display:grid; grid-template-columns:1fr; gap:16px; margin-bottom:24px; }
  @media(min-width:640px){ .bench-grid{ grid-template-columns:repeat(3,1fr); } }
  .bench-label{ font-size:12px; font-weight:500; color:var(--muted); margin-bottom:6px; }

  .loading{ height:640px; width:100%; display:flex; align-items:center; justify-content:center; }
  .spinner{
    width:28px; height:28px; border:3px solid var(--blue-soft); border-top-color:var(--blue);
    border-radius:50%; animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  svg.ic{ display:block; }
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spinner"></div></div></div>

<script>
/* -------------------------------------------------------------------
   Icons — small inline SVGs, stroke-based, no external icon library
------------------------------------------------------------------- */
const ICONS = {
  zap: `<svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,
  gauge: (c)=>`<svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15l3.5-3.5"/><path d="M20.5 12A8.5 8.5 0 1 0 12 20.5"/><circle cx="12" cy="12" r="1"/></svg>`,
  clipboard: (c)=>`<svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/><path d="M9 12h6M9 16h6"/></svg>`,
  calendar: (c)=>`<svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`,
  coins: (c)=>`<svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="6"/><path d="M14.6 4.6A6 6 0 1 1 19.4 14"/></svg>`,
  trophy: (c)=>`<svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M17 5h3a2 2 0 0 1-2 4M7 5H4a2 2 0 0 0 2 4"/></svg>`,
  plus: `<svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>`,
  trash: `<svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>`,
  check: (c)=>`<svg class="ic" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
  circle: (c)=>`<svg class="ic" width="12" height="12" viewBox="0 0 24 24" fill="${c}" stroke="none"><circle cx="12" cy="12" r="8"/></svg>`,
  alert: (c)=>`<svg class="ic" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>`,
  rotate: `<svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>`,
};
const C = {
  navy:'#0B2440', blue:'#2E7DD1', blueSoft:'#DCEAFB', amber:'#D99A34', amberSoft:'#F7E7CE',
  green:'#2E9E6D', greenSoft:'#DDF0E7', red:'#C24A42', redSoft:'#F6DEDB', bg:'#F3F5F8',
  border:'#DFE4EA', muted:'#647184', text:'#152233',
};

/* -------------------------------------------------------------------
   Constants & helpers
------------------------------------------------------------------- */
const EQUIPMENT_TYPES = ["หม้อแปลงจำหน่าย","LBS","UNIT SUBSTATION"];
const PRIORITIES = ["สูง","กลาง","ต่ำ"];
const PLAN_STATUSES = ["วางแผน","กำลังดำเนินการ","เสร็จสิ้น","เลื่อน"];
const PM_STATUSES = ["เสร็จสิ้น","ระหว่างดำเนินการ","รอดำเนินการ"];
const STORAGE_KEY = "mea-pm-app-data-v1";

const uid = () => Date.now() + "-" + Math.random().toString(36).slice(2,8);
const baht = (n) => "฿" + Number(n||0).toLocaleString("th-TH",{maximumFractionDigits:0});
const thDate = (d) => d ? new Date(d).toLocaleDateString("th-TH",{day:"2-digit",month:"short",year:"2-digit"}) : "-";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function seedData(){
  const today = new Date();
  const iso = (off) => { const d = new Date(today); d.setDate(d.getDate()+off); return d.toISOString().slice(0,10); };
  return {
    seeded:true,
    benchmarks:{ "หม้อแปลงจำหน่าย":8500, "LBS":4200, "UNIT SUBSTATION":12000 },
    pmRecords:[
      {id:uid(),date:iso(-12),equipmentType:"หม้อแปลงจำหน่าย",equipmentId:"TR-SP-0142",location:"สายป้อน สป.12",team:"ทีม A",technician:"สมชาย ใจดี",laborHours:6,materialCost:3200,laborCost:2100,otherCost:300,maintenanceType:"ป้องกัน",status:"เสร็จสิ้น",notes:"ตรวจสภาพน้ำมันและบุชชิ่งปกติ"},
      {id:uid(),date:iso(-9),equipmentType:"LBS",equipmentId:"LBS-SP-0087",location:"สายป้อน สป.05",team:"ทีม B",technician:"วิภา ศรีสุข",laborHours:3,materialCost:1500,laborCost:1000,otherCost:100,maintenanceType:"ป้องกัน",status:"เสร็จสิ้น",notes:"หล่อลื่นกลไกและตรวจหน้าสัมผัส"},
      {id:uid(),date:iso(-5),equipmentType:"UNIT SUBSTATION",equipmentId:"US-SP-0021",location:"นิคมฯ บางปู",team:"ทีม A",technician:"สมชาย ใจดี",laborHours:8,materialCost:6000,laborCost:2800,otherCost:500,maintenanceType:"ป้องกัน",status:"เสร็จสิ้น",notes:"ตรวจ Thermoscan จุดต่อสาย"},
      {id:uid(),date:iso(-2),equipmentType:"หม้อแปลงจำหน่าย",equipmentId:"TR-SP-0198",location:"สายป้อน สป.08",team:"ทีม C",technician:"อรุณ พงษ์ไทย",laborHours:5,materialCost:2600,laborCost:1900,otherCost:200,maintenanceType:"ป้องกัน",status:"ระหว่างดำเนินการ",notes:""},
    ],
    planRecords:[
      {id:uid(),equipmentType:"หม้อแปลงจำหน่าย",equipmentId:"TR-SP-0210",location:"สายป้อน สป.03",plannedDate:iso(4),team:"ทีม B",priority:"สูง",status:"วางแผน"},
      {id:uid(),equipmentType:"LBS",equipmentId:"LBS-SP-0102",location:"สายป้อน สป.11",plannedDate:iso(7),team:"ทีม A",priority:"กลาง",status:"วางแผน"},
      {id:uid(),equipmentType:"UNIT SUBSTATION",equipmentId:"US-SP-0033",location:"นิคมฯ บางพลี",plannedDate:iso(-1),team:"ทีม C",priority:"สูง",status:"เลื่อน"},
    ],
  };
}

/* -------------------------------------------------------------------
   State
------------------------------------------------------------------- */
let STATE = null;
let TAB = "dashboard";
let SAVING = false;
let CHARTS = {};
const emptyPm = () => ({ date:new Date().toISOString().slice(0,10), equipmentType:EQUIPMENT_TYPES[0], equipmentId:"", location:"", team:"", technician:"", laborHours:"", materialCost:"", laborCost:"", otherCost:"", maintenanceType:"ป้องกัน", status:"เสร็จสิ้น", notes:"" });
const emptyPlan = () => ({ equipmentType:EQUIPMENT_TYPES[0], equipmentId:"", location:"", plannedDate:new Date().toISOString().slice(0,10), team:"", priority:"กลาง", status:"วางแผน" });
let pmForm = emptyPm();
let planForm = emptyPlan();

async function init(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    STATE = (res && res.value) ? JSON.parse(res.value) : seedData();
    if(!res || !res.value) await window.storage.set(STORAGE_KEY, JSON.stringify(STATE), false);
  }catch(e){ STATE = seedData(); }
  render();
}

async function persist(next){
  STATE = next; SAVING = true; render();
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(STATE), false); }
  catch(e){ console.error("storage error", e); }
  SAVING = false; renderSidebarFooter();
}

/* -------------------------------------------------------------------
   Shared bits
------------------------------------------------------------------- */
function statusPill(status){
  const map = {
    "เสร็จสิ้น":{bg:C.greenSoft,fg:C.green,icon:'check'},
    "กำลังดำเนินการ":{bg:C.blueSoft,fg:C.blue,icon:'circle'},
    "ระหว่างดำเนินการ":{bg:C.blueSoft,fg:C.blue,icon:'circle'},
    "รอดำเนินการ":{bg:C.amberSoft,fg:C.amber,icon:'circle'},
    "วางแผน":{bg:C.amberSoft,fg:C.amber,icon:'circle'},
    "เลื่อน":{bg:C.redSoft,fg:C.red,icon:'alert'},
  };
  const s = map[status] || {bg:C.border,fg:C.muted,icon:'circle'};
  return `<span class="pill" style="background:${s.bg};color:${s.fg}">${ICONS[s.icon](s.fg)} ${esc(status)}</span>`;
}
function kpiCard(iconKey,label,value,sub,accent){
  return `<div class="card kpi-card">
    <div class="kpi-top">
      <span class="kpi-label">${esc(label)}</span>
      <span class="kpi-icon" style="background:${accent}20;">${ICONS[iconKey](accent)}</span>
    </div>
    <div class="kpi-value">${esc(value)}</div>
    ${sub ? `<span class="kpi-sub">${esc(sub)}</span>` : ""}
  </div>`;
}
function sectionHeader(title,desc){
  return `<div class="section-header"><h2 class="section-title">${esc(title)}</h2>${desc?`<p class="section-desc">${esc(desc)}</p>`:""}</div>`;
}
function emptyState(text){ return `<div class="empty-state">${esc(text)}</div>`; }
function field(label, innerHtml){ return `<label class="field"><span class="field-label">${esc(label)}</span>${innerHtml}</label>`; }

function recordsTable(records, {withDelete, compact} = {}){
  if(!records.length) return emptyState("ยังไม่มีข้อมูลงาน PM");
  const headers = ["วันที่","อุปกรณ์","รหัส","ทีม","ต้นทุนรวม","สถานะ"];
  if(withDelete && !compact) headers.push("");
  return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>
    ${records.map(r=>{
      const total = Number(r.materialCost)+Number(r.laborCost)+Number(r.otherCost);
      return `<tr>
        <td>${thDate(r.date)}</td>
        <td>${esc(r.equipmentType)}</td>
        <td class="mono muted">${esc(r.equipmentId)}</td>
        <td>${esc(r.team)}</td>
        <td class="mono">${baht(total)}</td>
        <td>${statusPill(r.status)}</td>
        ${withDelete && !compact ? `<td style="text-align:right"><button class="icon-btn" data-del-pm="${r.id}">${ICONS.trash}</button></td>` : ""}
      </tr>`;
    }).join("")}
  </tbody></table></div>`;
}

/* -------------------------------------------------------------------
   Renderers
------------------------------------------------------------------- */
const NAV = [
  {id:"dashboard", label:"แดชบอร์ด", icon:"gauge"},
  {id:"entry", label:"บันทึกข้อมูล PM", icon:"clipboard"},
  {id:"plan", label:"วางแผนบำรุงรักษา", icon:"calendar"},
  {id:"cost", label:"วิเคราะห์ต้นทุน", icon:"coins"},
  {id:"kpi", label:"ตัวชี้วัด & Productivity", icon:"trophy"},
];

function render(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-icon">${ICONS.zap}</div>
          <div><div class="brand-title">MEA PM Planner</div><div class="brand-sub">เขตสมุทรปราการ</div></div>
        </div>
        ${NAV.map(n=>`<button class="nav-btn ${TAB===n.id?"active":""}" data-tab="${n.id}">${ICONS[n.icon](TAB===n.id?"#fff":"#B6C4DA")} ${n.label}</button>`).join("")}
        <div class="sidebar-footer" id="sidebar-footer">${sidebarFooterHtml()}</div>
      </aside>
      <main class="main" id="main">${renderTab()}</main>
    </div>
  `;
  attachGlobalListeners();
  attachTabListeners();
  if(TAB==="dashboard") drawDashboardCharts();
}

function sidebarFooterHtml(){
  return `<button class="clear-btn" id="clear-btn">${ICONS.rotate} ล้างข้อมูลทั้งหมด</button>
    <div class="save-note">${SAVING ? "กำลังบันทึก…" : "บันทึกอัตโนมัติในเครื่องนี้"}</div>`;
}
function renderSidebarFooter(){
  const el = document.getElementById("sidebar-footer");
  if(el) el.innerHTML = sidebarFooterHtml();
}

function renderTab(){
  if(TAB==="dashboard") return renderDashboard();
  if(TAB==="entry") return renderEntry();
  if(TAB==="plan") return renderPlan();
  if(TAB==="cost") return renderCost();
  if(TAB==="kpi") return renderKpi();
  return "";
}

/* ---- Dashboard ---- */
function renderDashboard(){
  const {pmRecords, planRecords} = STATE;
  const totalCost = pmRecords.reduce((s,r)=>s+Number(r.materialCost)+Number(r.laborCost)+Number(r.otherCost),0);
  const completed = pmRecords.filter(r=>r.status==="เสร็จสิ้น").length;
  const avgCost = pmRecords.length ? totalCost/pmRecords.length : 0;
  const upcoming = planRecords.filter(p=>p.status!=="เสร็จสิ้น").length;

  return `

        <h3>Labor Productivity รายทีม (งาน / ชั่วโมงแรงงาน)</h3>
        <div class="chart-wrap" id="prodChartWrap"><canvas id="prodChart"></canvas></div>
      </div>
    </div>
    <div class="card chart-card">
      <h3>งาน PM ล่าสุด</h3>
      ${recordsTable(pmRecords.slice(0,5), {compact:true})}

  `;
}

function drawDashboardCharts(){
  const {pmRecords, benchmarks} = STATE;
  Object.values(CHARTS).forEach(c=>c && c.destroy());
  CHARTS = {};

  const costByType = EQUIPMENT_TYPES.map(t=>{
    const recs = pmRecords.filter(r=>r.equipmentType===t);
    const cost = recs.reduce((s,r)=>s+Number(r.materialCost)+Number(r.laborCost)+Number(r.otherCost),0);
    return { type:t, actual: recs.length ? Math.round(cost/recs.length) : 0, bench: benchmarks[t]||0 };
  });
  const costCtx = document.getElementById("costChart");
  if(costCtx){
    CHARTS.cost = new Chart(costCtx, {
      type:"bar",
      data:{
        labels: costByType.map(d=>d.type),
        datasets:[
          {label:"ต้นทุนจริง (เฉลี่ย)", data: costByType.map(d=>d.actual), backgroundColor:C.blue, borderRadius:4},
          {label:"มาตรฐาน WCM", data: costByType.map(d=>d.bench), backgroundColor:C.amber, borderRadius:4},
        ]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{position:"bottom", labels:{font:{size:11}}}, tooltip:{callbacks:{label:(ctx)=>ctx.dataset.label+": "+baht(ctx.parsed.y)}} },
        scales:{ y:{ grid:{color:C.border}, ticks:{font:{size:10}} }, x:{ grid:{display:false}, ticks:{font:{size:11}} } }
      }
    });
  }

  const teamMap = {};
  pmRecords.filter(r=>r.status==="เสร็จสิ้น").forEach(r=>{
    teamMap[r.team] = teamMap[r.team] || {tasks:0,hours:0};
    teamMap[r.team].tasks += 1;
    teamMap[r.team].hours += Number(r.laborHours)||0;
  });
  const teams = Object.keys(teamMap);
  const prodWrap = document.getElementById("prodChartWrap");
  if(!teams.length){
    if(prodWrap) prodWrap.outerHTML = emptyState("ยังไม่มีงานที่เสร็จสิ้นสำหรับคำนวณ");
  } else {
    const palette = [C.blue,C.green,C.amber,C.red];
    const prodCtx = document.getElementById("prodChart");
    if(prodCtx){
      CHARTS.prod = new Chart(prodCtx, {
        type:"bar",
        data:{ labels: teams, datasets:[{ label:"งาน/ชม.แรงงาน", data: teams.map(t=> teamMap[t].hours ? +(teamMap[t].tasks/teamMap[t].hours).toFixed(2) : 0), backgroundColor: teams.map((_,i)=>palette[i%4]), borderRadius:4 }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{grid:{color:C.border},ticks:{font:{size:10}}}, x:{grid:{display:false},ticks:{font:{size:11}}} } }
      });
    }
  }
}

/* ---- Cost Analysis ---- */
function renderCost(){
  const {pmRecords, benchmarks} = STATE;
  const rows = EQUIPMENT_TYPES.map(t=>{
    const recs = pmRecords.filter(r=>r.equipmentType===t);
    const totalCost = recs.reduce((s,r)=>s+Number(r.materialCost)+Number(r.laborCost)+Number(r.otherCost),0);
    const avg = recs.length ? totalCost/recs.length : 0;
    const bench = benchmarks[t]||0;
    const variance = bench ? (avg-bench)/bench*100 : 0;
    return {type:t, count:recs.length, totalCost, avg, bench, variance};
  });
  return `
    ${sectionHeader("วิเคราะห์ต้นทุนงาน PM เทียบมาตรฐาน WCM","เปรียบเทียบต้นทุนจริงต่ออุปกรณ์กับค่ามาตรฐาน (แก้ไขค่ามาตรฐานได้ตามข้อมูล WCM ของหน่วยงาน)")}
    <div class="bench-grid">
      ${EQUIPMENT_TYPES.map(t=>`<div class="card">
        <div class="bench-label">${esc(t)} — มาตรฐาน WCM (บาท/งาน)</div>
        <input type="number" data-benchmark="${esc(t)}" value="${benchmarks[t]??0}" style="width:100%;border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:14px;font-family:inherit;"/>
      </div>`).join("")}
    </div>
    <div class="card chart-card">
      <h3>สรุปต้นทุนต่อประเภทอุปกรณ์</h3>
      <div class="table-wrap"><table><thead><tr>
        <th>ประเภทอุปกรณ์</th><th>จำนวนงาน</th><th>ต้นทุนรวม</th><th>ต้นทุนเฉลี่ย/งาน</th><th>มาตรฐาน WCM</th><th>ส่วนต่าง</th>
      </tr></thead><tbody>
      ${rows.map(r=>`<tr>
        <td>${esc(r.type)}</td>
        <td class="mono">${r.count}</td>
        <td class="mono">${baht(r.totalCost)}</td>
        <td class="mono">${baht(r.avg)}</td>
        <td class="mono muted">${baht(r.bench)}</td>
        <td>${r.count ? `<span class="pill" style="background:${r.variance<=0?C.greenSoft:C.redSoft};color:${r.variance<=0?C.green:C.red}">${r.variance>0?"+":""}${r.variance.toFixed(1)}%</span>` : `<span class="muted">ไม่มีข้อมูล</span>`}</td>
      </tr>`).join("")}
      </tbody></table></div>
    </div>
  `;
}

/* ---- KPI ---- */
function renderKpi(){
  const {pmRecords, planRecords} = STATE;
  const byPerson = {};
  pmRecords.forEach(r=>{
    const key = r.technician || "ไม่ระบุ";
    byPerson[key] = byPerson[key] || {tasks:0, completedTasks:0, hours:0, cost:0, team:r.team};
    byPerson[key].tasks += 1;
    byPerson[key].hours += Number(r.laborHours)||0;
    byPerson[key].cost += Number(r.materialCost)+Number(r.laborCost)+Number(r.otherCost);
    if(r.status==="เสร็จสิ้น") byPerson[key].completedTasks += 1;
  });
  const rows = Object.entries(byPerson).map(([name,v])=>({
    name, team:v.team, tasks:v.tasks,
    completionRate: v.tasks ? Math.round(v.completedTasks/v.tasks*100) : 0,
    productivity: v.hours ? +(v.completedTasks/v.hours).toFixed(2) : 0,
    cost: v.cost,
  })).sort((a,b)=>b.productivity-a.productivity);
  const planCompletion = planRecords.length ? Math.round(planRecords.filter(p=>p.status==="เสร็จสิ้น").length/planRecords.length*100) : 0;
  const avgProd = rows.length ? (rows.reduce((s,r)=>s+r.productivity,0)/rows.length).toFixed(2) : "0";

  return `
    ${sectionHeader("ตัวชี้วัดงานบำรุงรักษา & Labor Productivity","ติดตามผลงานรายบุคคล/ทีม เพื่อเพิ่มประสิทธิภาพและ LABOR PRODUCTIVITY")}
    <div class="kpi-grid kpi3">
      ${kpiCard("gauge","อัตราการปิดแผนงาน", planCompletion+"%", "แผนงานที่เสร็จสิ้นตามกำหนด", C.green)}
      ${kpiCard("trophy","ผู้ปฏิบัติงานที่มีข้อมูล", rows.length, "จำนวนช่างที่บันทึกงาน", C.blue)}
      ${kpiCard("gauge","Productivity เฉลี่ย", avgProd, "งานเสร็จ / ชั่วโมงแรงงาน", C.amber)}
    </div>
    <div class="card chart-card">
      <h3>ผลงานรายบุคคล</h3>
      ${rows.length ? `<div class="table-wrap"><table><thead><tr>
        <th>ผู้ปฏิบัติงาน</th><th>ทีม</th><th>จำนวนงาน</th><th>อัตราสำเร็จ</th><th>Productivity (งาน/ชม.)</th><th>ต้นทุนรวม</th>
      </tr></thead><tbody>
      ${rows.map(r=>`<tr>
        <td>${esc(r.name)}</td>
        <td class="muted">${esc(r.team)}</td>
        <td class="mono">${r.tasks}</td>
        <td class="mono">${r.completionRate}%</td>
        <td class="mono">${r.productivity}</td>
        <td class="mono">${baht(r.cost)}</td>
      </tr>`).join("")}
      </tbody></table></div>` : emptyState("ยังไม่มีข้อมูลผู้ปฏิบัติงาน")}
    </div>
  `;
}

/* -------------------------------------------------------------------
   Listeners
------------------------------------------------------------------- */
function attachGlobalListeners(){
  document.querySelectorAll("[data-tab]").forEach(btn=>{
    btn.addEventListener("click", ()=>{ TAB = btn.getAttribute("data-tab"); render(); });
  });
  const clearBtn = document.getElementById("clear-btn");
  if(clearBtn) clearBtn.addEventListener("click", ()=>{
    persist({ seeded:false, benchmarks: seedData().benchmarks, pmRecords:[], planRecords:[] });
  });
}

function attachTabListeners(){
  if(TAB==="entry"){
    const form = document.getElementById("pm-form");
    form.addEventListener("submit", (e)=>{
      e.preventDefault();
      const val = id => document.getElementById(id).value;
      const equipmentId = val("f-equipmentId"), team = val("f-team");
      if(!equipmentId || !team) return;
      const record = {
        date: val("f-date"), equipmentType: val("f-equipmentType"), equipmentId, location: val("f-location"),
        team, technician: val("f-technician"), laborHours: Number(val("f-laborHours"))||0,
        materialCost: Number(val("f-materialCost"))||0, laborCost: Number(val("f-laborCost"))||0,
        otherCost: Number(val("f-otherCost"))||0, maintenanceType: val("f-maintenanceType"),
        status: val("f-status"), notes: val("f-notes"), id: uid(),
      };
      pmForm = emptyPm();
      persist({ ...STATE, pmRecords: [record, ...STATE.pmRecords] });
    });
    document.querySelectorAll("[data-del-pm]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.getAttribute("data-del-pm");
        persist({ ...STATE, pmRecords: STATE.pmRecords.filter(r=>r.id!==id) });
      });
    });
  }

  if(TAB==="plan"){
    const form = document.getElementById("plan-form");
    form.addEventListener("submit", (e)=>{
      e.preventDefault();
      const val = id => document.getElementById(id).value;
      const equipmentId = val("p-equipmentId"), team = val("p-team");
      if(!equipmentId || !team) return;
      const record = {
        equipmentType: val("p-equipmentType"), equipmentId, location: val("p-location"),
        plannedDate: val("p-plannedDate"), team, priority: val("p-priority"), status:"วางแผน", id: uid(),
      };
      planForm = emptyPlan();
      persist({ ...STATE, planRecords: [record, ...STATE.planRecords] });
    });
    document.querySelectorAll("[data-plan-status]").forEach(sel=>{
      sel.addEventListener("change", ()=>{
        const id = sel.getAttribute("data-plan-status");
        persist({ ...STATE, planRecords: STATE.planRecords.map(r=> r.id===id ? {...r, status: sel.value} : r) });
      });
    });
    document.querySelectorAll("[data-del-plan]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.getAttribute("data-del-plan");
        persist({ ...STATE, planRecords: STATE.planRecords.filter(r=>r.id!==id) });
      });
    });
  }

  if(TAB==="cost"){
    document.querySelectorAll("[data-benchmark]").forEach(inp=>{
      inp.addEventListener("change", ()=>{
        const type = inp.getAttribute("data-benchmark");
        persist({ ...STATE, benchmarks: { ...STATE.benchmarks, [type]: Number(inp.value)||0 } });
      });
    });
  }
}

init();
</script>
