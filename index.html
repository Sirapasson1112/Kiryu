<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>MEA PM Planner — เขตสมุทรปราการ (Ultimate Master Edition)</title>

<!-- Chart.js & SheetJS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- Leaflet Map CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');

  :root{
    --navy: #091E36;
    --navy-dark: #051324;
    --navy-light: #133358;
    --electric: #0088FF;
    --electric-glow: rgba(0, 136, 255, 0.35);
    --blue-soft: #EBF4FE;
    --amber: #F59E0B;
    --amber-soft: #FEF3C7;
    --green: #10B981;
    --green-soft: #D1FAE5;
    --red: #EF4444;
    --red-soft: #FEE2E2;
    --purple: #8B5CF6;
    --purple-soft: #EDE9FE;
    --bg: #F0F4F9;
    --surface: #FFFFFF;
    --surface-glass: rgba(255, 255, 255, 0.9);
    --border: #E2E8F0;
    --text: #0F172A;
    --muted: #64748B;
    --bottom-nav-height: 66px;
    --radius: 16px;
    --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 20px 40px rgba(9, 30, 54, 0.15);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans Thai','Plus Jakarta Sans',sans-serif;
    background:var(--bg); color:var(--text);
    background-image: radial-gradient(at 0% 0%, rgba(0, 136, 255, 0.05) 0px, transparent 50%),
                      radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.05) 0px, transparent 50%);
    background-attachment: fixed;
  }
  #app{ width:100%; min-height:100vh; display:flex; flex-direction:column; }
  .shell{ display:flex; flex-direction:column; min-height:100vh; width:100%; }
  @media(min-width:768px){ .shell{ flex-direction:row; } }

  .card{
    background:var(--surface-glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.8); border-radius:var(--radius); padding:20px;
    box-shadow:var(--shadow-sm); transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:hover{ box-shadow:var(--shadow-md); }

  /* Topbar Mobile */
  .mobile-topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--navy); padding:14px 18px; color:#fff;
  }
  @media(min-width:768px){ .mobile-topbar{ display:none; } }

  /* Desktop Sidebar */
  .sidebar{
    background:var(--navy); padding:24px 18px; display:none; width:270px; flex-direction:column; flex-shrink:0;
  }
  @media(min-width:768px){ .sidebar{ display:flex; } }
  .brand{ display:flex; align-items:center; gap:12px; margin-bottom:24px; padding:0 6px; }
  .brand-icon{
    width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg, var(--electric), #005cb3);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 4px 14px var(--electric-glow);
    color: #fff; font-weight: bold;
  }
  .brand-title{ color:#fff; font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:16px; }
  .brand-sub{ color:#94A3B8; font-size:11px; margin-top:2px; }

  .user-badge{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,0.06); padding:10px 14px; border-radius:12px; margin-bottom:20px;
    border:1px solid rgba(255,255,255,0.08);
  }
  .user-badge-role{ font-size:13px; font-weight:600; color:#fff; }
  .user-badge-tag{ font-size:10px; font-weight:700; padding:3px 8px; border-radius:6px; background:var(--electric); color:#fff; }

  .nav-btn{
    display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px;
    font-size:14px; font-weight:500; color:#94A3B8; background:transparent;
    border:none; cursor:pointer; text-align:left; font-family:inherit; transition:0.2s;
  }
  .nav-btn:hover{ background:rgba(255,255,255,0.06); color:#fff; transform:translateX(3px); }
  .nav-btn.active{
    background:linear-gradient(135deg, var(--electric), #0066CC); color:#fff; font-weight:600;
    box-shadow:0 4px 14px var(--electric-glow);
  }

  /* Bottom Navigation */
  .bottom-nav{
    position:fixed; bottom:0; left:0; width:100%; height:var(--bottom-nav-height);
    background:rgba(9, 30, 54, 0.96); backdrop-filter:blur(16px);
    display:flex; align-items:center; justify-content:space-around;
    z-index:900; border-top:1px solid rgba(255,255,255,0.1); padding-bottom:env(safe-area-inset-bottom);
  }
  @media(min-width:768px){ .bottom-nav{ display:none; } }
  .b-nav-item{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; background:none; border:none; color:#94A3B8; font-size:10px; font-family:inherit;
    flex:1; height:100%; cursor:pointer; padding:4px 0;
  }
  .b-nav-item.active{ color:#00D2FF; font-weight:700; }

  /* Main Area */
  .main{
    flex:1; padding:20px 16px; overflow-y:auto;
    padding-bottom:calc(var(--bottom-nav-height) + 30px);
  }
  @media(min-width:768px){ .main{ padding:36px; padding-bottom:36px; } }

  h2.section-title{ font-family:'Plus Jakarta Sans','Noto Sans Thai',sans-serif; font-size:22px; font-weight:800; color:var(--navy); margin:0; }
  .section-desc{ font-size:13px; color:var(--muted); margin:4px 0 0; }
  .section-header{ margin-bottom:20px; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px; }
  .header-actions{ display:flex; gap:8px; flex-wrap:wrap; width:100%; }
  @media(min-width:640px){ .header-actions{ width:auto; } }

  /* KPI Grid */
  .kpi-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:24px; }
  @media(min-width:1024px){ .kpi-grid{ grid-template-columns:repeat(4,1fr); gap:18px; } }
  .kpi-grid.kpi3{ grid-template-columns:repeat(2,1fr); }
  @media(min-width:1024px){ .kpi-grid.kpi3{ grid-template-columns:repeat(3,1fr); } }

  .kpi-card{
    display:flex; flex-direction:column; gap:8px; border-left:4px solid var(--electric);
    cursor:pointer; position:relative; overflow:hidden;
  }
  .kpi-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-md); }
  .kpi-card::after{
    content:"คลิกเพื่อดูรายละเอียด ↗"; position:absolute; bottom:8px; right:12px;
    font-size:10px; color:var(--muted); opacity:0; transition:0.2s;
  }
  .kpi-card:hover::after{ opacity:1; }

  .kpi-card.green{ border-left-color: var(--green); }
  .kpi-card.amber{ border-left-color: var(--amber); }
  .kpi-card.purple{ border-left-color: var(--purple); }
  .kpi-card.red{ border-left-color: var(--red); }

  .kpi-top{ display:flex; align-items:center; justify-content:space-between; }
  .kpi-label{ font-size:13px; font-weight:600; color:var(--muted); }
  .kpi-icon{ border-radius:10px; padding:8px; display:flex; }
  .kpi-value{ font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:700; color:var(--navy); }
  @media(min-width:640px){ .kpi-value{ font-size:28px; } }
  .kpi-sub{ font-size:11px; color:var(--muted); }

  #map-container{ height: 420px; width: 100%; border-radius: 14px; z-index: 1; border: 1px solid var(--border); }
  #mini-entry-map{ height: 160px; width: 100%; border-radius: 12px; border: 1px solid var(--border); margin-top: 8px; }

  .custom-numbered-pin{
    background: linear-gradient(135deg, #0088FF, #0055CC);
    color: #ffffff; border-radius: 50%; width: 28px !important; height: 28px !important;
    display: flex !important; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px;
    border: 2px solid #ffffff; box-shadow: 0 4px 10px rgba(0, 136, 255, 0.45);
  }
  .custom-start-pin{
    background: linear-gradient(135deg, #10B981, #059669);
    color: #ffffff; border-radius: 50%; width: 32px !important; height: 32px !important;
    display: flex !important; align-items: center; justify-content: center;
    font-weight: 800; font-size: 14px; border: 2px solid #ffffff;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.5);
  }

  /* Charts */
  .chart-grid{ display:grid; grid-template-columns:1fr; gap:18px; margin-bottom:24px; }
  @media(min-width:1024px){ .chart-grid{ grid-template-columns:1fr 1fr; } }
  .chart-card h3{ font-size:15px; font-weight:700; color:var(--navy); margin:0 0 16px; }
  .chart-wrap{ height:300px; position:relative; width:100%; }

  /* Interactive Form & Live Widgets */
  .toolbar{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .toolbar input, .toolbar select{
    padding:10px 14px; border:1px solid var(--border); border-radius:10px; font-size:13px; font-family:inherit; background:var(--surface); flex:1; min-height:44px;
  }
  form.entry-form{ background:var(--surface-glass); border:1px solid var(--border); border-radius:var(--radius); padding:20px; display:grid; grid-template-columns:1fr; gap:16px; margin-bottom:24px; box-shadow:var(--shadow-sm); }
  @media(min-width:640px){ form.entry-form{ grid-template-columns:1fr 1fr; } }
  @media(min-width:1024px){ form.entry-form{ grid-template-columns:1fr 1fr 1fr; } }
  .field{ display:flex; flex-direction:column; gap:6px; font-size:13px; }
  .field-label{ color:var(--muted); font-weight:600; font-size:12px; }
  .field input, .field select, .field textarea{ width:100%; border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:14px; outline:none; background:var(--surface); color:var(--text); font-family:inherit; transition:.15s; min-height:44px; }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--electric); box-shadow:0 0 0 3px var(--electric-glow); }
  .span-all{ grid-column:1/-1; }
  .span-2{ grid-column:span 1; }
  @media(min-width:1024px){ .span-2{ grid-column:span 2; } }
  .form-actions{ grid-column:1/-1; display:flex; justify-content:flex-end; gap:10px; }

  .live-calc-box{
    background: linear-gradient(135deg, #091E36 0%, #153D68 100%);
    border-radius: 14px; padding: 18px; color: #fff; display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 8px 20px rgba(9, 30, 54, 0.15); border: 1px solid rgba(255, 255, 255, 0.12);
  }
  .hi-gauge-card{
    background: #FFFFFF; border: 1px solid var(--border); border-radius: 14px; padding: 16px;
    display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-sm);
  }
  .hi-slider-row{ display: flex; flex-direction: column; gap: 3px; font-size: 12px; font-weight: 600; }
  .hi-slider-row input[type=range]{ width: 100%; accent-color: var(--electric); cursor: pointer; }

  .photo-dropzone{
    border: 2px dashed #94A3B8; border-radius: 12px; padding: 16px; text-align: center;
    background: #F8FAFC; cursor: pointer; transition: 0.2s; position: relative;
  }
  .photo-dropzone:hover{ border-color: var(--electric); background: var(--blue-soft); }
  .photo-thumb{ width:70px; height:70px; border-radius:8px; object-fit:cover; border:2px solid var(--border); box-shadow:var(--shadow-sm); cursor:pointer; }

  .btn-primary{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:10px; padding:12px 20px; font-size:14px; font-weight:600; color:#fff; background:linear-gradient(135deg, var(--electric), #0066CC); cursor:pointer; font-family:inherit; transition:0.2s; min-height:44px; width:100%; box-shadow:0 4px 12px var(--electric-glow); }
  @media(min-width:640px){ .btn-primary{ width:auto; } }
  .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 6px 16px var(--electric-glow); }
  .btn-secondary{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--border); border-radius:10px; padding:10px 16px; font-size:13px; font-weight:600; color:var(--text); background:var(--surface); cursor:pointer; font-family:inherit; transition:0.2s; min-height:42px; }
  .btn-secondary:hover{ background:var(--bg); }
  .btn-success{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:10px; padding:10px 16px; font-size:13px; font-weight:600; color:#fff; background:linear-gradient(135deg, #10B981, #059669); cursor:pointer; font-family:inherit; transition:0.2s; min-height:42px; }

  /* Mobile Record List */
  .mobile-record-list{ display:flex; flex-direction:column; gap:12px; }
  @media(min-width:768px){ .mobile-record-list{ display:none; } }
  .m-record-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow-sm);
  }
  .m-card-id{ font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--electric); font-size:15px; }

  /* Desktop Table */
  .desktop-table-wrap{ display:none; overflow-x:auto; }
  @media(min-width:768px){ .desktop-table-wrap{ display:block; } }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; padding:12px 14px 12px 0; font-weight:700; color:var(--muted); border-bottom:2px solid var(--border); white-space:nowrap; }
  td{ padding:14px 14px 14px 0; border-bottom:1px solid var(--border); white-space:nowrap; vertical-align:middle; }
  .mono{ font-family:'JetBrains Mono',monospace; }

  .pill{ display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:4px 10px; font-size:11px; font-weight:600; }
  .capacity-pill{ display:inline-flex; align-items:center; border-radius:6px; padding:2px 8px; font-size:11px; font-weight:700; font-family:'JetBrains Mono',monospace; background:var(--purple-soft); color:var(--purple); border:1px solid #DDD6FE; }
  .dist-badge{ display:inline-flex; align-items:center; border-radius:6px; padding:2px 6px; font-size:11px; font-weight:600; font-family:'JetBrains Mono',monospace; background:#F1F5F9; color:#475569; }
  
  .btn-sm{ padding:6px 12px; font-size:12px; border-radius:8px; border:1px solid var(--electric); background:var(--blue-soft); color:var(--electric); cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; justify-content:center; font-weight:600; min-height:34px; transition:0.15s; }
  .btn-sm:hover{ background:var(--electric); color:#fff; }

  .bench-grid{ display:grid; grid-template-columns:1fr; gap:12px; margin-bottom:20px; }
  @media(min-width:640px){ .bench-grid{ grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px; } }
  .bench-label{ font-size:12px; font-weight:600; color:var(--muted); margin-bottom:4px; }

  .modal-backdrop{
    position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(9,30,54,0.7);
    display:flex; align-items:flex-end; justify-content:center; z-index:9999; padding:0; backdrop-filter:blur(4px);
  }
  @media(min-width:640px){ .modal-backdrop{ align-items:center; padding:20px; } }
  .modal-card{
    background:var(--surface); border-radius:24px 24px 0 0; width:100%; max-width:680px;
    max-height:88vh; overflow-y:auto; padding:24px; box-shadow:var(--shadow-lg);
  }
  @media(min-width:640px){ .modal-card{ border-radius:20px; } }

  svg.ic{ display:block; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="kpi-modal-root"></div>
<input type="file" id="excel-importer" accept=".xlsx, .xls, .csv" style="display:none;" />

<script>
const ICONS = {
  zap: `<svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,

  gps: `<svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>`,
  camera: `<svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`,
  plus: `<svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>`,
  fileExcel: `<svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="17"/><line x1="16" y1="13" x2="8" y2="17"/></svg>`,
  filePdf: `<svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M10 12h2a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1h-2v-4z"/><path d="M10 18v-2"/></svg>`,
  upload: `<svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`,

function calculateDistance(lat1, lon1, lat2 = MEA_HQ_COORDS[0], lon2 = MEA_HQ_COORDS[1]) {
  const R = 6371;
  const dLat = (lat1 - lat2) * Math.PI / 180;
  const dLon = (lon1 - lon2) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat2 * Math.PI / 180) * Math.cos(lat1 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return +(R * c).toFixed(1);
}

function generate300Records(){
  const today = new Date();
  const iso = (off) => { const d = new Date(today); d.setDate(d.getDate() + off); return d.toISOString().slice(0,10); };
  const benchmarks = { "หม้อแปลงจำหน่าย": 8500, "LBS": 4200, "UNIT SUBSTATION": 12500, "รีโคลสเซอร์ (Recloser)": 6500, "ดรอปเอาท์ฟิวส์": 2500 };
  const typePrefix = { "หม้อแปลงจำหน่าย":"TR-SP-", "LBS":"LBS-SP-", "UNIT SUBSTATION":"US-SP-", "รีโคลสเซอร์ (Recloser)":"RC-SP-", "ดรอปเอาท์ฟิวส์":"DF-SP-" };

  const pmRecords = [];
  for (let i = 1; i <= 300; i++) {
    const eqType = EQUIPMENT_TYPES[i % EQUIPMENT_TYPES.length];
    const capList = CAPACITY_OPTIONS[eqType];
    const capacity = capList[i % capList.length];
    const tech = TECHNICIANS[i % TECHNICIANS.length];
    const loc = LOCATIONS_LIST[i % LOCATIONS_LIST.length];
    const dayOffset = -Math.floor(i * 0.4);
    
    const bench = benchmarks[eqType];
    const varianceFactor = 0.75 + (Math.sin(i) + 1) * 0.25;
    const totalCalc = Math.round(bench * varianceFactor);
    const materialCost = Math.round(totalCalc * 0.55);
    const laborCost = Math.round(totalCalc * 0.35);
    const otherCost = totalCalc - materialCost - laborCost;
    const laborHours = +(2.5 + (i % 6) * 1.0).toFixed(1);
    const status = i <= 285 ? "เสร็จสิ้น" : (i <= 295 ? "ระหว่างดำเนินการ" : "รอดำเนินการ");
    const healthIndex = Math.min(100, Math.max(70, Math.round(98 - (i % 25))));

    pmRecords.push({
      id: "PM-SP-" + (1000 + i),
      date: iso(dayOffset),
      equipmentType: eqType,
      capacity: capacity,
      equipmentId: typePrefix[eqType] + String(100 + i).padStart(4, '0'),
      location: loc,
      team: tech.team,
      technician: tech.name,
      laborHours: laborHours,
      materialCost: materialCost,
      laborCost: laborCost,
      otherCost: otherCost,
      maintenanceType: (i % 12 === 0) ? "แก้ไข" : "ป้องกัน",
      status: status,
      notes: `ตรวจเช็คตามรอบบำรุงรักษาประจำปี วัดค่าความต้านทานฉนวนปกติ Health Index ${healthIndex}%`,
      photo: ""
    });
  }

  const planRecords = [];
  for (let j = 1; j <= 50; j++) {
    const eqType = EQUIPMENT_TYPES[(j * 2) % EQUIPMENT_TYPES.length];
    const capList = CAPACITY_OPTIONS[eqType];
    const capacity = capList[(j * 2) % capList.length];
    const tech = TECHNICIANS[(j * 3) % TECHNICIANS.length];
    const loc = LOCATIONS_LIST[(j * 2) % LOCATIONS_LIST.length];
    const plannedOffset = Math.floor(j * 0.6) + 1;

    planRecords.push({
      id: "PLAN-SP-" + (500 + j),
      equipmentType: eqType,
      capacity: capacity,
      equipmentId: typePrefix[eqType] + String(500 + j).padStart(4, '0'),
      location: loc,
      plannedDate: iso(plannedOffset),
      team: tech.team,
      priority: (j % 3 === 0) ? "สูง" : ((j % 2 === 0) ? "กลาง" : "ต่ำ"),
      status: (j % 15 === 0) ? "เลื่อน" : "วางแผน"
    });
  }

  return { benchmarks, pmRecords, planRecords };
}

function exportToExcel(filename, sheetName, dataArray) {
  if (typeof XLSX === 'undefined') return alert("ระบบกำลังโหลดโมดูล Excel");
  const ws = XLSX.utils.aoa_to_sheet(dataArray);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  XLSX.writeFile(wb, filename + ".xlsx");
}

function triggerExcelImport(target) {

function handleFileImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
      if (rows.length < 2) return;

      if (IMPORT_TARGET === "pm") {
        const imported = [];
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r || !r[1] || !r[3]) continue;
          imported.push({
            id: uid(),
            date: r[0] ? String(r[0]).slice(0,10) : new Date().toISOString().slice(0,10),
            equipmentType: r[1] || EQUIPMENT_TYPES[0],
            capacity: r[2] || CAPACITY_OPTIONS[r[1]||EQUIPMENT_TYPES[0]][0],
            equipmentId: String(r[3]),
            location: r[4] || "",
            team: r[5] || "ทีม A",
            technician: r[6] || "",
            laborHours: Number(r[7]) || 0,
            materialCost: Number(r[8]) || 0,
            laborCost: Number(r[9]) || 0,
            otherCost: Number(r[10]) || 0,
            maintenanceType: r[12] || "ป้องกัน",
            status: r[13] || "เสร็จสิ้น",
            notes: r[14] || "นำเข้าจาก Excel",
            photo: ""
          });
        }
        if(imported.length){
          persist({ ...STATE, pmRecords: [...imported, ...STATE.pmRecords] });
          alert(`นำเข้าสำเร็จ ${imported.length} รายการ`);
        }
      }
    } catch(err) { alert("เกิดข้อผิดพลาดในการอ่านไฟล์"); }
  };
  reader.readAsArrayBuffer(file);
}

function getSortedInspectionPoints(){
  const { planRecords, pmRecords } = STATE;
  const activePlans = planRecords.filter(p => p.status !== "เสร็จสิ้น");
  const pendingPMs = pmRecords.filter(p => p.status === "ระหว่างดำเนินการ" || p.status === "รอดำเนินการ").map(p => ({
    equipmentType: p.equipmentType, capacity: p.capacity, equipmentId: p.equipmentId, location: p.location, team: p.team, priority: "สูง", status: p.status, plannedDate: p.date
  }));
  const combined = [...activePlans, ...pendingPMs];

  const pointsWithCoords = combined.map(item => {
    const coords = LOCATIONS_COORDS[item.location] || [13.5850, 100.6380];
    const distance = calculateDistance(coords[0], coords[1]);
    return { ...item, coords, distance };
  });

  pointsWithCoords.sort((a, b) => a.distance - b.distance);
  return pointsWithCoords;
}

function attachModalListeners(){
  const closeBtn = document.getElementById("modal-close-btn");
  const cancelBtn = document.getElementById("modal-cancel-btn");
  const backdrop = document.getElementById("modal-backdrop");
  const closeModal = () => { EDITING_RECORD = null; renderModal(); };

  if(closeBtn) closeBtn.onclick = closeModal;
  if(cancelBtn) cancelBtn.onclick = closeModal;
  if(backdrop) backdrop.onclick = (e) => { if(e.target === backdrop) closeModal(); };

  const mGpsBtn = document.getElementById("m-gps-btn");
  if(mGpsBtn){
    mGpsBtn.onclick = () => {
      if("geolocation" in navigator){
        mGpsBtn.innerText = "กำลังหาพิกัด...";
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const locInput = document.getElementById("m-location");
            if(locInput){
              locInput.value = `พิกัด GPS: ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
            }
            mGpsBtn.innerHTML = `${ICONS.gps} ดึง GPS`;
          },
          (err) => {
            alert("ไม่สามารถเข้าถึงตำแหน่งได้");
            mGpsBtn.innerHTML = `${ICONS.gps} ดึง GPS`;
          },
          { timeout: 10000 }
        );
      }
    };
  }

  let modalPhotoBase64 = EDITING_RECORD?.data?.photo || "";
  const mPhotoInput = document.getElementById("m-photo-input");
  if(mPhotoInput){
    mPhotoInput.onchange = (e) => {
      const file = e.target.files[0];
      if(file){
        const reader = new FileReader();
        reader.onload = (evt) => {
          modalPhotoBase64 = evt.target.result;
          const prev = document.getElementById("m-photo-preview");
          if(prev) prev.innerHTML = `<img src="${modalPhotoBase64}" class="photo-thumb" id="m-thumb-img"/>`;
        };
        reader.readAsDataURL(file);
      }
    };
  }

  const editTypeSelect = document.getElementById("m-equipmentType");
  if(editTypeSelect){
    editTypeSelect.onchange = () => {
      const selectedType = editTypeSelect.value;
      const capSelect = document.getElementById("m-capacity");
      if(capSelect && CAPACITY_OPTIONS[selectedType]){
        capSelect.innerHTML = CAPACITY_OPTIONS[selectedType].map(c=>`<option>${c}</option>`).join("");
      }
    };
  }

  const editPmForm = document.getElementById("edit-pm-form");
  if(editPmForm){
    editPmForm.onsubmit = (e) => {
      e.preventDefault();
      const val = id => document.getElementById(id).value;
      const updated = {
        ...EDITING_RECORD.data,
        date: val("m-date"), equipmentType: val("m-equipmentType"), capacity: val("m-capacity"),
        equipmentId: val("m-equipmentId"), location: val("m-location"), team: val("m-team"), technician: val("m-technician"),
        laborHours: Number(val("m-laborHours"))||0, materialCost: Number(val("m-materialCost"))||0,
        laborCost: Number(val("m-laborCost"))||0, otherCost: Number(val("m-otherCost"))||0,
        maintenanceType: val("m-maintenanceType"), status: val("m-status"), notes: val("m-notes"),
        photo: modalPhotoBase64
      };
      persist({ ...STATE, pmRecords: STATE.pmRecords.map(r => r.id === updated.id ? updated : r) });
      EDITING_RECORD = null; renderModal();
    };
  }
}

  if(TAB==="plan") return renderPlan();
  if(TAB==="cost") return renderCost();
  if(TAB==="kpi") return renderKpi();
  return renderDashboard();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
