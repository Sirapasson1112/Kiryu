<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>MEA PM Planner — กฟน. เขตสมุทรปราการ</title>

<!-- Chart.js & SheetJS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- Leaflet Map CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap');

  :root{
    --navy: #091E36;
    --navy-dark: #051324;
    --navy-light: #133358;
    --electric: #0088FF;
    --electric-glow: rgba(0, 136, 255, 0.4);
    --cyan: #06B6D4;
    --cyan-glow: rgba(6, 182, 212, 0.35);
    --blue-soft: #EBF4FE;
    --amber: #F59E0B;
    --amber-soft: #FEF3C7;
    --green: #10B981;
    --green-soft: #D1FAE5;
    --red: #EF4444;
    --red-soft: #FEE2E2;
    --purple: #8B5CF6;
    --purple-soft: #EDE9FE;
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --surface-glass: rgba(255, 255, 255, 0.85);
    --border: #E2E8F0;
    --border-glass: rgba(255, 255, 255, 0.6);
    --text: #0F172A;
    --muted: #64748B;
    --bottom-nav-height: 68px;
    --radius: 18px;
    --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.03);
    --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 20px 45px rgba(9, 30, 54, 0.14);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans Thai','Plus Jakarta Sans',sans-serif;
    background:var(--bg); color:var(--text);
    background-image: 
      radial-gradient(at 0% 0%, rgba(0, 136, 255, 0.06) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.06) 0px, transparent 50%);
    background-attachment: fixed;
  }
  #app{ width:100%; min-height:100vh; display:flex; flex-direction:column; }
  .shell{ display:flex; flex-direction:column; min-height:100vh; width:100%; }
  @media(min-width:768px){ .shell{ flex-direction:row; } }

  .glass-card{
    background:var(--surface-glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--border-glass); border-radius:var(--radius); padding:22px;
    box-shadow:var(--shadow-sm); transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .glass-card:hover{ box-shadow:var(--shadow-md); }

  /* Login Ultra UI */
  .login-container{
    display:flex; align-items:center; justify-content:center; min-height:100vh; width:100%; padding:20px;
    background: linear-gradient(135deg, #030C16 0%, #091E36 50%, #0F3A66 100%);
    position: relative; overflow: hidden;
  }
  .login-container::before{
    content:""; position:absolute; width:500px; height:500px; border-radius:50%;
    background:radial-gradient(circle, rgba(0,136,255,0.25) 0%, transparent 70%);
    top:-150px; right:-150px; filter:blur(60px);
  }
  .login-card{
    background:rgba(255, 255, 255, 0.96); backdrop-filter:blur(20px);
    border-radius:28px; padding:40px; width:100%; max-width:440px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.8);
    position: relative; z-index: 10;
  }

  /* Topbar Mobile */
  .mobile-topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--navy); padding:14px 20px; color:#fff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }
  @media(min-width:768px){ .mobile-topbar{ display:none; } }

  /* Desktop Sidebar Pro */
  .sidebar{
    background:var(--navy); padding:26px 20px; display:none; width:280px; flex-direction:column; flex-shrink:0;
    box-shadow: 4px 0 24px rgba(0,0,0,0.06);
  }
  @media(min-width:768px){ .sidebar{ display:flex; } }
  .brand{ display:flex; align-items:center; gap:14px; margin-bottom:28px; padding:0 6px; }
  .brand-icon{
    width:42px; height:42px; border-radius:14px; background:linear-gradient(135deg, #00A6FF, #0066CC);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff; font-weight:bold;
    box-shadow: 0 4px 16px var(--electric-glow);
  }
  .brand-title{ color:#fff; font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:16px; letter-spacing:-0.2px; }
  .brand-sub{ color:#94A3B8; font-size:11px; margin-top:2px; }

  .user-badge{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,0.06); padding:12px 14px; border-radius:14px; margin-bottom:24px;
    border:1px solid rgba(255,255,255,0.08); backdrop-filter:blur(8px);
  }
  .user-badge-role{ font-size:13px; font-weight:700; color:#fff; }
  .user-badge-tag{ font-size:10px; font-weight:800; padding:3px 8px; border-radius:6px; background:var(--electric); color:#fff; letter-spacing:0.5px; }

  .nav-btn{
    display:flex; align-items:center; gap:14px; padding:13px 16px; border-radius:12px;
    font-size:14px; font-weight:600; color:#94A3B8; background:transparent;
    border:none; cursor:pointer; text-align:left; font-family:inherit; transition:0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .nav-btn:hover{ background:rgba(255,255,255,0.06); color:#fff; transform:translateX(3px); }
  .nav-btn.active{
    background:linear-gradient(135deg, #0088FF, #0055CC); color:#fff; font-weight:700;
    box-shadow:0 6px 20px var(--electric-glow);
  }

  /* Bottom Navigation Mobile */
  .bottom-nav{
    position:fixed; bottom:0; left:0; width:100%; height:var(--bottom-nav-height);
    background:rgba(9, 30, 54, 0.95); backdrop-filter:blur(20px);
    display:flex; align-items:center; justify-content:space-around;
    z-index:900; border-top:1px solid rgba(255,255,255,0.1); padding-bottom:env(safe-area-inset-bottom);
  }
  @media(min-width:768px){ .bottom-nav{ display:none; } }
  .b-nav-item{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px; background:none; border:none; color:#94A3B8; font-size:10px; font-family:inherit;
    flex:1; height:100%; cursor:pointer; padding:4px 0; transition:0.15s;
  }
  .b-nav-item.active{ color:#00D2FF; font-weight:700; }

  /* Main Area */
  .main{
    flex:1; padding:22px 18px; overflow-y:auto;
    padding-bottom:calc(var(--bottom-nav-height) + 30px);
  }
  @media(min-width:768px){ .main{ padding:38px; padding-bottom:38px; } }

  h2.section-title{ font-family:'Plus Jakarta Sans','Noto Sans Thai',sans-serif; font-size:24px; font-weight:800; color:var(--navy); margin:0; letter-spacing:-0.5px; }
  .section-desc{ font-size:13px; color:var(--muted); margin:4px 0 0; }
  .section-header{ margin-bottom:24px; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:14px; }
  .header-actions{ display:flex; gap:10px; flex-wrap:wrap; width:100%; }
  @media(min-width:640px){ .header-actions{ width:auto; } }

  /* KPI Cards */
  .kpi-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin-bottom:26px; }
  @media(min-width:1024px){ .kpi-grid{ grid-template-columns:repeat(4,1fr); gap:20px; } }

  .kpi-card{
    display:flex; flex-direction:column; gap:10px; border-left:4px solid var(--electric);
    cursor:pointer; position:relative; overflow:hidden;
  }
  .kpi-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow-md); }
  .kpi-card::after{
    content:"คลิกดูรายละเอียด ↗"; position:absolute; bottom:8px; right:12px;
    font-size:10px; color:var(--muted); opacity:0; transition:0.2s;
  }
  .kpi-card:hover::after{ opacity:1; }
  .kpi-card.green{ border-left-color: var(--green); }
  .kpi-card.amber{ border-left-color: var(--amber); }
  .kpi-card.red{ border-left-color: var(--red); }

  .kpi-top{ display:flex; align-items:center; justify-content:space-between; }
  .kpi-label{ font-size:13px; font-weight:700; color:var(--muted); }
  .kpi-icon{ border-radius:12px; padding:9px; display:flex; }
  .kpi-value{ font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:800; color:var(--navy); }
  @media(min-width:640px){ .kpi-value{ font-size:30px; } }
  .kpi-sub{ font-size:11px; color:var(--muted); }

  .hi-progress{ width:100%; height:6px; background:#E2E8F0; border-radius:99px; overflow:hidden; margin-top:2px; }
  .hi-bar{ height:100%; border-radius:99px; background:linear-gradient(90deg, #10B981, #06B6D4); }

  #map-container{ height: 440px; width: 100%; border-radius: 16px; z-index: 1; border: 1px solid var(--border); box-shadow:inset 0 2px 6px rgba(0,0,0,0.04); }

  .formula-btn{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
    color:var(--electric); background:var(--blue-soft); padding:5px 12px; border-radius:8px;
    cursor:pointer; border:1px solid #BFDBFE; transition:0.15s;
  }
  .formula-btn:hover{ background:var(--electric); color:#fff; }
  .formula-box{
    background:#0B132B; color:#E2E8F0; padding:18px; border-radius:14px;
    font-family:'JetBrains Mono', monospace; font-size:13px; line-height:1.75;
    margin:14px 0; border:1px solid #1E293B; box-shadow:inset 0 2px 8px rgba(0,0,0,0.4);
  }

  .chart-grid{ display:grid; grid-template-columns:1fr; gap:20px; margin-bottom:26px; }
  @media(min-width:1024px){ .chart-grid{ grid-template-columns:1fr 1fr; } }
  .chart-card h3{ font-size:15px; font-weight:800; color:var(--navy); margin:0 0 16px; }
  .chart-wrap{ height:320px; position:relative; width:100%; }

  .toolbar{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .toolbar input, .toolbar select{
    padding:11px 16px; border:1px solid var(--border); border-radius:12px; font-size:13px; font-family:inherit; background:var(--surface); flex:1; min-height:46px;
  }
  form.entry-form{ background:var(--surface-glass); border:1px solid var(--border); border-radius:var(--radius); padding:24px; display:grid; grid-template-columns:1fr; gap:16px; margin-bottom:26px; box-shadow:var(--shadow-sm); }
  @media(min-width:640px){ form.entry-form{ grid-template-columns:1fr 1fr; } }
  @media(min-width:1024px){ form.entry-form{ grid-template-columns:1fr 1fr 1fr; } }
  .field{ display:flex; flex-direction:column; gap:6px; font-size:13px; }
  .field-label{ color:var(--muted); font-weight:700; font-size:12px; }
  .field input, .field select, .field textarea{ width:100%; border:1px solid var(--border); border-radius:12px; padding:11px 16px; font-size:14px; outline:none; background:var(--surface); color:var(--text); font-family:inherit; transition:.15s; min-height:46px; }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--electric); box-shadow:0 0 0 3px var(--electric-glow); }
  .span-all{ grid-column:1/-1; }
  .form-actions{ grid-column:1/-1; display:flex; justify-content:flex-end; gap:10px; }

  .btn-primary{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:12px; padding:12px 22px; font-size:14px; font-weight:700; color:#fff; background:linear-gradient(135deg, #0088FF, #0055CC); cursor:pointer; font-family:inherit; transition:0.2s; min-height:46px; box-shadow:0 4px 16px var(--electric-glow); }
  @media(min-width:640px){ .btn-primary{ width:auto; } }
  .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 8px 22px var(--electric-glow); }
  .btn-secondary{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--border); border-radius:12px; padding:11px 18px; font-size:13px; font-weight:700; color:var(--text); background:var(--surface); cursor:pointer; font-family:inherit; transition:0.2s; min-height:44px; }
  .btn-secondary:hover{ background:#F1F5F9; }
  .btn-success{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:12px; padding:11px 18px; font-size:13px; font-weight:700; color:#fff; background:linear-gradient(135deg, #10B981, #059669); cursor:pointer; font-family:inherit; transition:0.2s; min-height:44px; }

  .mobile-record-list{ display:flex; flex-direction:column; gap:12px; }
  @media(min-width:768px){ .mobile-record-list{ display:none; } }
  .m-record-card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow-sm);
  }
  .m-card-id{ font-family:'JetBrains Mono',monospace; font-weight:800; color:var(--electric); font-size:15px; }

  .desktop-table-wrap{ display:none; overflow-x:auto; }
  @media(min-width:768px){ .desktop-table-wrap{ display:block; } }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; padding:12px 14px 12px 0; font-weight:800; color:var(--muted); border-bottom:2px solid var(--border); white-space:nowrap; }
  td{ padding:14px 14px 14px 0; border-bottom:1px solid var(--border); white-space:nowrap; vertical-align:middle; }
  .mono{ font-family:'JetBrains Mono',monospace; }

  .pill{ display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:4px 10px; font-size:11px; font-weight:700; }
  .capacity-pill{ display:inline-flex; align-items:center; border-radius:8px; padding:3px 8px; font-size:11px; font-weight:800; font-family:'JetBrains Mono',monospace; background:var(--purple-soft); color:var(--purple); border:1px solid #DDD6FE; }
  
  .btn-sm{ padding:7px 14px; font-size:12px; border-radius:8px; border:1px solid var(--electric); background:var(--blue-soft); color:var(--electric); cursor:pointer; font-family:inherit; display:inline-flex; align-items:center; justify-content:center; font-weight:700; min-height:34px; }
  .btn-sm:hover{ background:var(--electric); color:#fff; }

  /* Modals */
  .modal-backdrop{
    position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(9,30,54,0.75);
    display:flex; align-items:flex-end; justify-content:center; z-index:9999; padding:0; backdrop-filter:blur(6px);
  }
  @media(min-width:640px){ .modal-backdrop{ align-items:center; padding:20px; } }
  .modal-card{
    background:var(--surface); border-radius:26px 26px 0 0; width:100%; max-width:780px;
    max-height:88vh; overflow-y:auto; padding:26px; box-shadow:var(--shadow-lg);
  }
  @media(min-width:640px){ .modal-card{ border-radius:22px; } }

  .custom-numbered-pin{
    background: linear-gradient(135deg, #0088FF, #0055CC);
    color: #ffffff; border-radius: 50%; width: 28px !important; height: 28px !important;
    display: flex !important; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 13px;
    border: 2px solid #ffffff; box-shadow: 0 4px 12px rgba(0, 136, 255, 0.45);
  }
  .custom-start-pin{
    background: linear-gradient(135deg, #10B981, #059669);
    color: #ffffff; border-radius: 50%; width: 34px !important; height: 34px !important;
    display: flex !important; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; border: 2px solid #ffffff;
    box-shadow: 0 4px 14px rgba(16, 185, 129, 0.5);
  }

  svg.ic{ display:block; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="kpi-modal-root"></div>
<div id="formula-modal-root"></div>
<input type="file" id="excel-importer" accept=".xlsx, .xls, .csv" style="display:none;" />

<script>
const ICONS = {
  zap: `<svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,
  gauge: (c)=>`<svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15l3.5-3.5"/><path d="M20.5 12A8.5 8.5 0 1 0 12 20.5"/><circle cx="12" cy="12" r="1"/></svg>`,
  clipboard: (c)=>`<svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/><path d="M9 12h6M9 16h6"/></svg>`,
  calendar: (c)=>`<svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`,
  coins: (c)=>`<svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="6"/><path d="M14.6 4.6A6 6 0 1 1 19.4 14"/></svg>`,
  trophy: (c)=>`<svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M17 5h3a2 2 0 0 1-2 4M7 5H4a2 2 0 0 0 2 4"/></svg>`,
  mapPin: (c)=>`<svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
  book: (c)=>`<svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>`,
  navigation: `<svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>`,
  calculator: `<svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/></svg>`,
  plus: `<svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>`,
  fileExcel: `<svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
  filePdf: `<svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
  upload: `<svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/></svg>`,
  edit: `<svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
  lock: `<svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
};

const C = {
  navy:'#091E36', blue:'#0088FF', blueSoft:'#EBF4FE', amber:'#F59E0B', amberSoft:'#FEF3C7',
  green:'#10B981', greenSoft:'#D1FAE5', red:'#EF4444', redSoft:'#FEE2E2', purple:'#8B5CF6', purpleSoft:'#EDE9FE',
  border:'#E2E8F0', muted:'#64748B', text:'#0F172A',

function calculateDistance(lat1, lon1, lat2 = MEA_HQ_COORDS[0], lon2 = MEA_HQ_COORDS[1]) {
  const R = 6371;
  const dLat = (lat1 - lat2) * Math.PI / 180;
  const dLon = (lon1 - lon2) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat2 * Math.PI / 180) * Math.cos(lat1 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return +(R * c).toFixed(1);
}

function generateSafeRecords(){
  const today = new Date();
  const iso = (off) => { const d = new Date(today); d.setDate(d.getDate() + off); return d.toISOString().slice(0,10); };
  const benchmarks = { "หม้อแปลงจำหน่าย": 8500, "LBS": 4200, "UNIT SUBSTATION": 12500, "รีโคลสเซอร์ (Recloser)": 6500, "ดรอปเอาท์ฟิวส์": 2500 };
  const typePrefix = { "หม้อแปลงจำหน่าย":"TR-SP-", "LBS":"LBS-SP-", "UNIT SUBSTATION":"US-SP-", "รีโคลสเซอร์ (Recloser)":"RC-SP-", "ดรอปเอาท์ฟิวส์":"DF-SP-" };

  const pmRecords = [];
  for (let i = 1; i <= 300; i++) {
    const eqType = EQUIPMENT_TYPES[i % EQUIPMENT_TYPES.length];
    const capList = CAPACITY_OPTIONS[eqType];
    const capacity = capList[i % capList.length];
    const tech = TECHNICIANS[i % TECHNICIANS.length];
    const loc = LOCATIONS_LIST[i % LOCATIONS_LIST.length];
    const bench = benchmarks[eqType];
    const varianceFactor = 0.8 + ((i % 7) * 0.05);
    const totalCalc = Math.round(bench * varianceFactor);
    const materialCost = Math.round(totalCalc * 0.55);
    const laborCost = Math.round(totalCalc * 0.35);
    const otherCost = totalCalc - materialCost - laborCost;

    pmRecords.push({
      id: "PM-SP-" + (1000 + i),
      date: iso(-Math.floor(i * 0.3)),
      equipmentType: eqType,
      capacity: capacity,
      equipmentId: typePrefix[eqType] + String(100 + i).padStart(4, '0'),
      location: loc,
      team: tech.team,
      technician: tech.name,
      laborHours: +(2.5 + (i % 5) * 1.0).toFixed(1),
      materialCost: materialCost,
      laborCost: laborCost,
      otherCost: otherCost,
      maintenanceType: (i % 10 === 0) ? "แก้ไข" : "ป้องกัน",
      status: i <= 285 ? "เสร็จสิ้น" : (i <= 295 ? "ระหว่างดำเนินการ" : "รอดำเนินการ"),
      notes: `ตรวจเช็คตามรอบ PM ปกติ Health Index ${Math.round(98 - (i % 20))}%`,
      photo: ""
    });
  }

  const planRecords = [];
  for (let j = 1; j <= 50; j++) {
    const eqType = EQUIPMENT_TYPES[(j * 2) % EQUIPMENT_TYPES.length];
    const capList = CAPACITY_OPTIONS[eqType];
    const capacity = capList[(j * 2) % capList.length];
    const tech = TECHNICIANS[(j * 3) % TECHNICIANS.length];
    const loc = LOCATIONS_LIST[(j * 2) % LOCATIONS_LIST.length];

    planRecords.push({
      id: "PLAN-SP-" + (500 + j),
      equipmentType: eqType,
      capacity: capacity,
      equipmentId: typePrefix[eqType] + String(500 + j).padStart(4, '0'),
      location: loc,
      plannedDate: iso(Math.floor(j * 0.5) + 1),
      team: tech.team,
      priority: (j % 3 === 0) ? "สูง" : ((j % 2 === 0) ? "กลาง" : "ต่ำ"),
      status: (j % 15 === 0) ? "เลื่อน" : "วางแผน"
    });
  }

  return { benchmarks, pmRecords, planRecords };
}

function triggerExcelImport(target) {

function handleFileImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
      if (rows.length < 2) return;

      if (IMPORT_TARGET === "pm") {
        const imported = [];
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r || !r[1] || !r[3]) continue;
          imported.push({
            id: uid(),
            date: r[0] ? String(r[0]).slice(0,10) : new Date().toISOString().slice(0,10),
            equipmentType: r[1] || EQUIPMENT_TYPES[0],
            capacity: r[2] || CAPACITY_OPTIONS[r[1]||EQUIPMENT_TYPES[0]][0],
            equipmentId: String(r[3]),
            location: r[4] || "",
            team: r[5] || "ทีม A",
            technician: r[6] || "",
            laborHours: Number(r[7]) || 0,
            materialCost: Number(r[8]) || 0,
            laborCost: Number(r[9]) || 0,
            otherCost: Number(r[10]) || 0,
            maintenanceType: r[12] || "ป้องกัน",
            status: r[13] || "เสร็จสิ้น",
            notes: r[14] || "นำเข้าจาก Excel",
            photo: ""
          });
        }
        if(imported.length){
          persist({ ...STATE, pmRecords: [...imported, ...STATE.pmRecords] });
          alert(`นำเข้าสำเร็จ ${imported.length} รายการ`);
        }
      } else if (IMPORT_TARGET === "plan") {
        const imported = [];
        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r || !r[1] || !r[3]) continue;
          imported.push({
            id: uid(),
            plannedDate: r[0] ? String(r[0]).slice(0,10) : new Date().toISOString().slice(0,10),
            equipmentType: r[1] || EQUIPMENT_TYPES[0],
            capacity: r[2] || CAPACITY_OPTIONS[r[1]||EQUIPMENT_TYPES[0]][0],
            equipmentId: String(r[3]),
            location: r[4] || "",
            team: r[5] || "ทีม A",
            priority: r[6] || "กลาง",
            status: r[7] || "วางแผน"
          });
        }
        if(imported.length){
          persist({ ...STATE, planRecords: [...imported, ...STATE.planRecords] });
          alert(`นำเข้าแผนงานสำเร็จ ${imported.length} รายการ`);
        }
      }
    } catch(err) { alert("เกิดข้อผิดพลาดในการอ่านไฟล์"); }
  };
  reader.readAsArrayBuffer(file);
}

function recordsTable(records, {withDelete, compact} = {}){
  const filtered = (records || []).filter(r => {
    if(!SEARCH_QUERY) return true;
    const q = SEARCH_QUERY.toLowerCase();
    return (r.equipmentId||"").toLowerCase().includes(q) ||
           (r.location||"").toLowerCase().includes(q) ||
           (r.team||"").toLowerCase().includes(q) ||
           (r.technician||"").toLowerCase().includes(q) ||
           (r.equipmentType||"").toLowerCase().includes(q);
  });

  if(!filtered.length) return emptyState("ไม่พบข้อมูลที่ตรงกับเงื่อนไข");

  const mobileCardsHtml = `
    <div class="mobile-record-list">
      ${filtered.slice(0, 30).map(r=>{
        const total = Number(r.materialCost)+Number(r.laborCost)+Number(r.otherCost);
        return `
          <div class="m-record-card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
              <div>
                <div class="m-card-id">${esc(r.equipmentId)} <span class="capacity-pill">${esc(r.capacity||"-")}</span></div>
                <div style="font-size:12px;color:var(--text);font-weight:700;margin-top:2px;">${esc(r.equipmentType)}</div>
                <div style="font-size:12px;color:var(--muted);margin-top:2px;">${thDate(r.date)} • ${esc(r.team)} ${r.technician ? `• ${esc(r.technician)}` : ""}</div>
              </div>
              <div><span class="pill" style="background:var(--green-soft);color:var(--green);">● ${esc(r.status)}</span></div>
            </div>
            <div style="font-size:12px;color:var(--muted);">${esc(r.location||"-")}</div>
            <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--border);padding-top:10px;margin-top:2px;">
              <div style="font-size:14px;font-weight:800;font-family:'JetBrains Mono',monospace;">${baht(total)}</div>
              <div style="display:flex;gap:6px;"><button class="btn-sm" data-edit-pm="${r.id}">${ICONS.edit} แก้ไข</button></div>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;

  const headers = ["วันที่","อุปกรณ์","ขนาดพิกัด","รหัส","สายป้อน / พื้นที่","ทีม","ผู้ปฏิบัติงาน","ต้นทุนรวม","สถานะ",""];
  const desktopTableHtml = `
    <div class="desktop-table-wrap">
      <table>
        <thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>
          ${filtered.slice(0, 50).map(r=>{
            const total = Number(r.materialCost)+Number(r.laborCost)+Number(r.otherCost);
            return `<tr>
              <td>${thDate(r.date)}</td>
              <td><strong>${esc(r.equipmentType)}</strong></td>
              <td><span class="capacity-pill">${esc(r.capacity||"-")}</span></td>
              <td class="mono" style="font-weight:700;color:var(--electric);">${esc(r.equipmentId)}</td>
              <td class="muted">${esc(r.location||"-")}</td>
              <td><span class="pill" style="background:var(--blue-soft);color:var(--navy);">${esc(r.team)}</span></td>
              <td style="font-size:12px;">${esc(r.technician||"-")}</td>
              <td class="mono" style="font-weight:800;">${baht(total)}</td>
              <td><span class="pill" style="background:var(--green-soft);color:var(--green);">● ${esc(r.status)}</span></td>
              <td style="text-align:right">
                <button class="btn-sm" title="แก้ไข" data-edit-pm="${r.id}">${ICONS.edit}</button>
              </td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
  return mobileCardsHtml + desktopTableHtml;
}

function renderTab(){
  if(TAB==="dashboard") return renderDashboard();
  if(TAB==="routes") return renderRoutes();
  if(TAB==="entry") return renderEntry();
  if(TAB==="guide") return renderGuide();
  if(TAB==="plan") return renderPlan();
  if(TAB==="cost" && CURRENT_USER.role === 'admin') return renderCost();
  if(TAB==="kpi" && CURRENT_USER.role === 'admin') return renderKpi();
  return renderDashboard();
}

function drawDashboardCharts(){
  const {pmRecords, benchmarks} = STATE;

  const costCtx = document.getElementById("costChart");
  if(costCtx && typeof Chart !== 'undefined'){
    if(CHARTS.cost) CHARTS.cost.destroy();

    const costByType = EQUIPMENT_TYPES.map(t=>{
      const recs = pmRecords.filter(r=>r.equipmentType===t);
      const cost = recs.reduce((s,r)=>s+Number(r.materialCost)+Number(r.laborCost)+Number(r.otherCost),0);
      return { actual: recs.length ? Math.round(cost/recs.length) : 0, bench: benchmarks[t]||0 };
    });

    CHARTS.cost = new Chart(costCtx, {
      type: "radar",
      data: {
        labels: ["หม้อแปลงจำหน่าย", "โหลดเบรกสวิตช์ (LBS)", "Unit Substation", "รีโคลสเซอร์ (Recloser)", "ดรอปเอาท์ฟิวส์"],
        datasets: [
          {
            label: "ต้นทุนจริงเฉลี่ย (Actual)",
            data: costByType.map(d=>d.actual),
            backgroundColor: "rgba(0, 136, 255, 0.28)",
            borderColor: "#0088FF",
            borderWidth: 2.5,
            pointBackgroundColor: "#0088FF",
            pointBorderColor: "#FFFFFF",
            pointRadius: 4
          },
          {
            label: "เกณฑ์มาตรฐาน WCM (Benchmark)",
            data: costByType.map(d=>d.bench),
            backgroundColor: "rgba(245, 158, 11, 0.22)",
            borderColor: "#F59E0B",
            borderWidth: 2,
            borderDash: [5, 5],
            pointBackgroundColor: "#F59E0B",
            pointBorderColor: "#FFFFFF",
            pointRadius: 4
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: "bottom",
            labels: { font: { family: "'Plus Jakarta Sans','Noto Sans Thai'", size: 12, weight: '700' }, padding: 14, usePointStyle: true, pointStyle: 'circle' }
          },
          tooltip: {
            backgroundColor: 'rgba(9, 30, 54, 0.95)',
            titleFont: { family: "'Plus Jakarta Sans','Noto Sans Thai'", size: 13, weight: '700' },
            bodyFont: { family: "'JetBrains Mono'", size: 12 },
            padding: 12,
            cornerRadius: 10,
            callbacks: { label: (ctx) => ` ${ctx.dataset.label}: ${baht(ctx.parsed.r)}` }
          }
        },
        scales: {
          r: {
            angleLines: { color: "rgba(226, 232, 240, 0.8)" },
            grid: { color: "rgba(226, 232, 240, 0.8)" },
            pointLabels: { font: { family: "'Noto Sans Thai', sans-serif", size: 11, weight: '700' }, color: "#334155" },
            ticks: { font: { family: "'JetBrains Mono'", size: 10 }, color: "#94A3B8", backdropColor: "transparent", callback: (v) => Number(v) > 0 ? (v / 1000) + "k" : "" }
          }
        }
      }
    });
  }

  const capCtx = document.getElementById("capacityChart");
  if(capCtx && typeof Chart !== 'undefined'){
    if(CHARTS.cap) CHARTS.cap.destroy();

    const capSummary = {
      "250-500 kVA (TR)": pmRecords.filter(r=>["250 kVA","315 kVA","400 kVA","500 kVA"].includes(r.capacity)).length,
      "1000-2000 kVA (US)": pmRecords.filter(r=>["1000 kVA (24kV)","1500 kVA (24kV)","2000 kVA (24kV)","1000 kVA"].includes(r.capacity)).length,
      "24 kV 630A (LBS/RC)": pmRecords.filter(r=>["24 kV 630A","24 kV 630A (12.5kA)"].includes(r.capacity)).length,
      "50-160 kVA (หม้อแปลงเล็ก)": pmRecords.filter(r=>["50 kVA","100 kVA","160 kVA"].includes(r.capacity)).length,
      "ฟิวส์ตัดตอน & อื่นๆ": pmRecords.filter(r=>["24 kV 100A","24 kV 200A","33 kV 100A","24 kV 1250A"].includes(r.capacity)).length,
    };

    CHARTS.cap = new Chart(capCtx, {
      type: "polarArea",
      data: {
        labels: Object.keys(capSummary),
        datasets: [{
          data: Object.values(capSummary),

            "rgba(0, 136, 255, 0.75)",
            "rgba(16, 185, 129, 0.75)",
            "rgba(139, 92, 246, 0.75)",
            "rgba(245, 158, 11, 0.75)",
            "rgba(6, 182, 212, 0.75)"
          ],
          borderColor: "#FFFFFF",
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            position: "right",
            labels: { font: { family: "'Noto Sans Thai'", size: 11, weight: '700' }, padding: 12, usePointStyle: true, boxWidth: 8 }
          },

            backgroundColor: 'rgba(9, 30, 54, 0.95)',
            titleFont: { family: "'Noto Sans Thai'", size: 12, weight: '700' },
            bodyFont: { family: "'JetBrains Mono'", size: 12 },
            padding: 12,
            cornerRadius: 10,
            callbacks: { label: (ctx) => ` จำนวน: ${ctx.parsed.r} งาน (${Math.round(ctx.parsed.r / pmRecords.length * 100)}%)` }
          }
        },
        scales: {
          r: { grid: { color: "rgba(226, 232, 240, 0.7)" }, ticks: { display: false } }

function renderRoutes(){
  const allPoints = STATE.pmRecords.slice(0, 20).map(item => {

function initMap(){
  const container = document.getElementById("map-container");
  if(!container || typeof L === 'undefined') return;
  if(LEAFLET_MAP) { LEAFLET_MAP.remove(); LEAFLET_MAP = null; }

  try {
    LEAFLET_MAP = L.map('map-container').setView(MEA_HQ_COORDS, 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(LEAFLET_MAP);

    const hqIcon = L.divIcon({ className: 'custom-start-pin', html: '⚡', iconSize: [34, 34], iconAnchor: [17, 17] });
    L.marker(MEA_HQ_COORDS, { icon: hqIcon }).addTo(LEAFLET_MAP).bindPopup('<b>📍 กฟน. เขตสมุทรปราการ</b><br>ศูนย์สั่งการบำรุงรักษา').openPopup();

    const points = STATE.pmRecords.slice(0, 15).map(item => {
      const coords = LOCATIONS_COORDS[item.location] || [13.5850, 100.6380];
      return { ...item, coords, distance: calculateDistance(coords[0], coords[1]) };
    }).sort((a, b) => a.distance - b.distance);

    points.forEach((r, idx) => {
      const numIcon = L.divIcon({ className: 'custom-numbered-pin', html: `<span>${idx + 1}</span>`, iconSize: [28, 28], iconAnchor: [14, 14] });
      L.marker(r.coords, { icon: numIcon }).addTo(LEAFLET_MAP)
        .bindPopup(`<b>ลำดับที่ ${idx + 1}</b>: ${esc(r.equipmentId)}<br>${esc(r.location)}<br>ระยะทาง: ~${r.distance} กม.`);
    });
  } catch(e){}
}

function attachLoginListener(){
  const loginForm = document.getElementById("login-form");
  if(loginForm){
    loginForm.onsubmit = (e) => {
      e.preventDefault();
      const u = document.getElementById("l-user").value.trim().toLowerCase();
      const p = document.getElementById("l-pass").value.trim();
      if(u === "admin" && p === "admin123"){
        CURRENT_USER = { username: "admin", role: "admin", name: "วิศวกรหัวหน้างาน" };
        localStorage.setItem(AUTH_KEY, JSON.stringify(CURRENT_USER)); render();
      } else if(u === "tech" && p === "tech123"){
        CURRENT_USER = { username: "tech", role: "tech", name: "ช่างประจำเขต สป." };
        localStorage.setItem(AUTH_KEY, JSON.stringify(CURRENT_USER)); render();
      } else {
        LOGIN_ERROR = "Username หรือ Password ไม่ถูกต้อง"; render();
      }
    };
  }
}

function attachGlobalListeners(){
  document.querySelectorAll("[data-tab]").forEach(btn=>{
    btn.onclick = () => { TAB = btn.getAttribute("data-tab"); render(); };
  });

  const goGuideBtn = document.getElementById("go-guide-btn");
  if(goGuideBtn) goGuideBtn.onclick = () => { TAB = "guide"; render(); };

  const logoutHandler = () => { CURRENT_USER = null; localStorage.removeItem(AUTH_KEY); render(); };
  const logoutBtn = document.getElementById("logout-btn");
  if(logoutBtn) logoutBtn.onclick = logoutHandler;
  const mLogoutBtn = document.getElementById("m-logout-btn");
  if(mLogoutBtn) mLogoutBtn.onclick = logoutHandler;

  const mMoreBtn = document.getElementById("m-more-btn");
  if(mMoreBtn) mMoreBtn.onclick = () => { TAB = TAB === 'plan' ? 'cost' : (TAB === 'cost' ? 'kpi' : 'plan'); render(); };

  document.querySelectorAll("#print-pdf-btn").forEach(btn => {
    btn.onclick = () => window.print();
  });

  const fileImporter = document.getElementById("excel-importer");
  if (fileImporter) fileImporter.onchange = handleFileImport;
}

function attachTabListeners(){
  const importPmBtn = document.getElementById("import-pm-btn");
  if(importPmBtn) importPmBtn.onclick = () => triggerExcelImport("pm");

  const importPlanBtn = document.getElementById("import-plan-btn");
  if(importPlanBtn) importPlanBtn.onclick = () => triggerExcelImport("plan");

  const exportPmExcelBtn = document.getElementById("export-pm-excel-btn");
  if(exportPmExcelBtn){
    exportPmExcelBtn.onclick = () => {
      const headers = ["วันที่", "ประเภทอุปกรณ์", "ขนาดพิกัด", "รหัสอุปกรณ์", "พื้นที่/สายป้อน", "ทีม", "ผู้ปฏิบัติงาน", "ชม.แรงงาน", "ค่าพัสดุ", "ค่าแรง", "ค่าใช้จ่ายอื่น", "รวมต้นทุน", "ประเภทงาน", "สถานะ", "หมายเหตุ"];
      const rows = STATE.pmRecords.map(r => [
        r.date, r.equipmentType, r.capacity||"-", r.equipmentId, r.location, r.team, r.technician,
        r.laborHours, r.materialCost, r.laborCost, r.otherCost,
        (Number(r.materialCost)+Number(r.laborCost)+Number(r.otherCost)),
        r.maintenanceType, r.status, r.notes
      ]);
      exportToExcel("MEA_PM_Records_" + new Date().toISOString().slice(0,10), "PM_Records", [headers, ...rows]);
    };
  }

  const exportPlanExcelBtn = document.getElementById("export-plan-excel-btn");
  if(exportPlanExcelBtn){
    exportPlanExcelBtn.onclick = () => {
      const headers = ["วันที่วางแผน", "ประเภทอุปกรณ์", "ขนาดพิกัด", "รหัสอุปกรณ์", "พื้นที่/สายป้อน", "ทีม", "ความสำคัญ", "สถานะ"];
      const rows = STATE.planRecords.map(r => [r.plannedDate, r.equipmentType, r.capacity||"-", r.equipmentId, r.location, r.team, r.priority, r.status]);
      exportToExcel("MEA_PM_Plans_" + new Date().toISOString().slice(0,10), "PM_Plans", [headers, ...rows]);
    };
  }

  const exportCostExcelBtn = document.getElementById("export-cost-excel-btn");
  if(exportCostExcelBtn){
    exportCostExcelBtn.onclick = () => {
      const headers = ["ประเภทอุปกรณ์", "จำนวนงาน", "ต้นทุนจริงรวม (บาท)", "เกณฑ์มาตรฐาน WCM (บาท)"];
      const rows = EQUIPMENT_TYPES.map(t => [t, STATE.pmRecords.filter(r => r.equipmentType === t).length, STATE.benchmarks[t] || 0]);
      exportToExcel("MEA_WCM_Cost_" + new Date().toISOString().slice(0,10), "WCM_Cost", [headers, ...rows]);
    };
  }

  const exportKpiExcelBtn = document.getElementById("export-kpi-excel-btn");
  if(exportKpiExcelBtn){
    exportKpiExcelBtn.onclick = () => {
      const headers = ["ช่างผู้ปฏิบัติงาน", "ทีม", "งานที่เสร็จสิ้น"];
      const rows = TECHNICIANS.map(t => [t.name, t.team, STATE.pmRecords.filter(r => r.technician === t.name && r.status === "เสร็จสิ้น").length]);
      exportToExcel("MEA_KPI_" + new Date().toISOString().slice(0,10), "KPI", [headers, ...rows]);
    };
  }

  const exportDashboardExcelBtn = document.getElementById("export-dashboard-excel-btn");
  if(exportDashboardExcelBtn){
    exportDashboardExcelBtn.onclick = () => {
      const headers = ["ตัวชี้วัด", "ค่าปัจจุบัน"];
      const totalCost = STATE.pmRecords.reduce((s,r)=>s+Number(r.materialCost)+Number(r.laborCost)+Number(r.otherCost),0);
      const rows = [
        ["จำนวนงาน PM ทั้งหมด", STATE.pmRecords.length],
        ["งานที่เสร็จสิ้น", STATE.pmRecords.filter(r=>r.status==="เสร็จสิ้น").length],
        ["Health Index เฉลี่ย", "93.8%"],
        ["ต้นทุนจริงรวม (บาท)", totalCost],
        ["แผนงานค้าง", STATE.planRecords.length]
      ];
      exportToExcel("MEA_Dashboard_Summary_" + new Date().toISOString().slice(0,10), "Summary", [headers, ...rows]);
    };
  }

  const exportRoutesExcelBtn = document.getElementById("export-routes-excel-btn");
  if(exportRoutesExcelBtn){
    exportRoutesExcelBtn.onclick = () => {
      const headers = ["ลำดับ", "สายป้อน / พื้นที่", "พิกัดละติจูด", "พิกัดลองจิจูด"];
      const rows = Object.entries(LOCATIONS_COORDS).map(([loc, coords], idx) => [idx + 1, loc, coords[0], coords[1]]);
      exportToExcel("MEA_Routes_" + new Date().toISOString().slice(0,10), "Routes", [headers, ...rows]);
    };
  }

  const fType = document.getElementById("f-equipmentType");
  if(fType){
    fType.onchange = () => {
      const capSelect = document.getElementById("f-capacity");
      if(capSelect && CAPACITY_OPTIONS[fType.value]){
        capSelect.innerHTML = CAPACITY_OPTIONS[fType.value].map(c => `<option>${c}</option>`).join("");
      }
    };
  }

  const pType = document.getElementById("p-equipmentType");
  if(pType){
    pType.onchange = () => {
      const capSelect = document.getElementById("p-capacity");
      if(capSelect && CAPACITY_OPTIONS[pType.value]){
        capSelect.innerHTML = CAPACITY_OPTIONS[pType.value].map(c => `<option>${c}</option>`).join("");
      }
    };
  }

  document.querySelectorAll("[data-convert-plan]").forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute("data-convert-plan");
      const plan = STATE.planRecords.find(p=>p.id===id);
      if(plan){
        pmForm = { ...emptyPm(), equipmentType: plan.equipmentType, capacity: plan.capacity, equipmentId: plan.equipmentId, location: plan.location, team: plan.team, date: plan.plannedDate };
        TAB = "entry"; render();
      }
    };
  });

  document.querySelectorAll("[data-del-plan]").forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.getAttribute("data-del-plan");
      if(confirm("ยืนยันการลบแผนงานนี้ใช่หรือไม่?")) persist({ ...STATE, planRecords: STATE.planRecords.filter(r=>r.id!==id) });
    };
  });

  document.querySelectorAll("[data-edit-pm]").forEach(btn=>{
    btn.onclick = () => {
      const id = btn.getAttribute("data-edit-pm");
      const item = STATE.pmRecords.find(r => r.id === id);
      if(item){ EDITING_RECORD = { type: "pm", data: { ...item } }; renderModal(); }
    };
  });

  const form = document.getElementById("pm-form");
  if(form){
    form.onsubmit = (e)=>{
      e.preventDefault();
      const record = {
        date: document.getElementById("f-date").value,
        equipmentType: document.getElementById("f-equipmentType").value,
        capacity: document.getElementById("f-capacity") ? document.getElementById("f-capacity").value : "-",
        equipmentId: document.getElementById("f-equipmentId").value,
        location: document.getElementById("f-location").value,
        team: document.getElementById("f-team").value,
        technician: CURRENT_USER?.name || "ช่างปฏิบัติงาน",
        laborHours: 3.0,
        materialCost: Number(document.getElementById("f-materialCost").value)||0,
        laborCost: Number(document.getElementById("f-laborCost").value)||0,
        otherCost: 0,
        maintenanceType: "ป้องกัน",
        status: "เสร็จสิ้น",
        notes: "บันทึกงานสำเร็จ",
        photo: "",
        id: uid()
      };
      persist({ ...STATE, pmRecords: [record, ...STATE.pmRecords] });
    };
  }

  const pForm = document.getElementById("plan-form");
  if(pForm){
    pForm.onsubmit = (e)=>{
      e.preventDefault();
      const record = {
        equipmentType: document.getElementById("p-equipmentType").value,
        capacity: document.getElementById("p-capacity") ? document.getElementById("p-capacity").value : "-",
        equipmentId: document.getElementById("p-equipmentId").value,
        location: document.getElementById("p-location").value,
        plannedDate: document.getElementById("p-plannedDate").value,
        team: document.getElementById("p-team").value,
        priority: document.getElementById("p-priority").value,
        status: "วางแผน",
        id: uid()
      };
      persist({ ...STATE, planRecords: [record, ...STATE.planRecords] });
    };
  }
}
