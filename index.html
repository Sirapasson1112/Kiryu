<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>MEA PM Planner — เขตสมุทรปราการ (Stable Edition)</title>

<!-- Chart.js & SheetJS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- Leaflet Map -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');

  :root{
    --navy: #091E36;
    --electric: #0088FF;
    --blue-soft: #EBF4FE;
    --amber: #F59E0B;
    --amber-soft: #FEF3C7;
    --green: #10B981;
    --green-soft: #D1FAE5;
    --red: #EF4444;
    --red-soft: #FEE2E2;
    --bg: #F0F4F9;
    --surface: #FFFFFF;
    --border: #E2E8F0;
    --text: #0F172A;
    --muted: #64748B;
    --bottom-height: 60px;
    --radius: 14px;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;font-family:'Noto Sans Thai',sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
  
  #app{width:100%; min-height:100vh; display:flex; flex-direction:column;}
  .shell{display:flex; flex-direction:column; min-height:100vh; width:100%;}
  @media(min-width:768px){.shell{flex-direction:row;}}

  .sidebar{
    background:var(--navy); padding:24px 16px; display:none; width:260px; flex-direction:column; flex-shrink:0; color:#fff;
  }
  @media(min-width:768px){.sidebar{display:flex;}}
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:24px;}
  .brand-icon{width:38px; height:38px; border-radius:10px; background:var(--electric); display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:18px;}
  
  .nav-btn{
    display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:10px;
    font-size:14px; font-weight:500; color:#94A3B8; background:transparent; border:none; cursor:pointer; text-align:left; width:100%; margin-bottom:4px;
    font-family:inherit; transition:0.2s;
  }
  .nav-btn:hover{background:rgba(255,255,255,0.06); color:#fff;}
  .nav-btn.active{background:var(--electric); color:#fff; font-weight:600;}

  .mobile-topbar{
    display:flex; align-items:center; justify-content:space-between; background:var(--navy); padding:14px 18px; color:#fff;
  }
  @media(min-width:768px){.mobile-topbar{display:none;}}

  .bottom-nav{
    position:fixed; bottom:0; left:0; width:100%; height:var(--bottom-height); background:var(--navy);
    display:flex; align-items:center; justify-content:space-around; z-index:900; border-top:1px solid rgba(255,255,255,0.1);
  }
  @media(min-width:768px){.bottom-nav{display:none;}}
  .b-nav-item{
    background:none; border:none; color:#94A3B8; font-size:10px; font-family:inherit; flex:1; height:100%; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  .b-nav-item.active{color:#00D2FF; font-weight:700;}

  .main{flex:1; padding:20px 16px; overflow-y:auto; padding-bottom:calc(var(--bottom-height) + 20px);}
  @media(min-width:768px){.main{padding:32px; padding-bottom:32px;}}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:0 2px 8px rgba(15,23,42,0.04); margin-bottom:20px;}
  
  .kpi-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:20px;}
  @media(min-width:1024px){.kpi-grid{grid-template-columns:repeat(4,1fr);}}
  .kpi-card{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:6px;}
  .kpi-value{font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:700; color:var(--navy);}

  .chart-grid{display:grid; grid-template-columns:1fr; gap:20px; margin-bottom:20px;}
  @media(min-width:1024px){.chart-grid{grid-template-columns:1fr 1fr;}}
  .chart-wrap{height:280px; position:relative; width:100%;}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:8px 16px; font-size:13px; font-weight:600; border-radius:8px; border:none; cursor:pointer; font-family:inherit;}
  .btn-primary{background:var(--electric); color:#fff;}
  .btn-success{background:var(--green); color:#fff;}
  .btn-outline{background:#fff; border:1px solid var(--border); color:var(--text);}

  .table-responsive{width:100%; overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; padding:10px 12px; background:#F8FAFC; color:var(--muted); border-bottom:1px solid var(--border); white-space:nowrap;}
  td{padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap;}
  .mono{font-family:'JetBrains Mono',monospace;}

  .pill{display:inline-flex; align-items:center; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600;}
  #map-container{height:400px; width:100%; border-radius:12px; border:1px solid var(--border);}
</style>
</head>
<body>
<div id="app"></div>

<script>
const CAPACITY_OPTIONS = {
  "หม้อแปลงจำหน่าย": ["50 kVA", "100 kVA", "250 kVA", "500 kVA", "1000 kVA"],
  "LBS": ["24 kV 630A", "33 kV 630A"],
  "UNIT SUBSTATION": ["1000 kVA (24kV)", "1500 kVA (24kV)"]
};
const EQUIPMENT_TYPES = Object.keys(CAPACITY_OPTIONS);

const LOCATIONS_COORDS = {
  "สายป้อน สป.01 (ปากน้ำ-สายลวด)": [13.5991, 100.5968],
  "สายป้อน สป.02 (ท้ายบ้าน)": [13.5780, 100.6010],
  "สายป้อน สป.03 (บางเมือง)": [13.6120, 100.6120],
  "สายป้อน สป.04 (ด่านสำโรง)": [13.6390, 100.6050]
};

const MEA_HQ = [13.5991, 100.5968];
const STORAGE_KEY = "mea_pm_stable_v1";

function generateData() {
  const pmRecords = [];
  for (let i = 1; i <= 30; i++) {
    pmRecords.push({
      id: "PM-" + (100 + i),
      date: "2026-05-10",
      equipmentType: EQUIPMENT_TYPES[i % EQUIPMENT_TYPES.length],
      capacity: "250 kVA",
      equipmentId: "TR-SP-" + String(100 + i),
      location: Object.keys(LOCATIONS_COORDS)[i % Object.keys(LOCATIONS_COORDS).length],
      team: "ทีม A",
      cost: 5000 + (i * 150),
      status: "เสร็จสิ้น"
    });
  }
  return { pmRecords };
}

let STATE = null;
let TAB = "dashboard";
let CHARTS = {};
let MAP = null;

function init() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    STATE = saved ? JSON.parse(saved) : generateData();
  } catch(e) {
    STATE = generateData();
  }
  render();
}

function baht(n) { return "฿" + Number(n||0).toLocaleString(); }
function esc(s) { return String(s || "").replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function render() {
  const app = document.getElementById("app");
  if (!app) return;

  const navs = [
    { id: "dashboard", label: "Dashboard", icon: "📊" },
    { id: "routes", label: "เส้นทางตรวจ", icon: "🗺️" },
    { id: "entry", label: "บันทึก PM", icon: "📝" },
    { id: "guide", label: "คู่มือเกณฑ์กรอก", icon: "📖" }
  ];

  app.innerHTML = `
    <div class="shell">
      <header class="mobile-topbar">
        <div><strong>MEA PM Planner</strong></div>
        <div style="font-size:12px;color:#94A3B8;">สมุทรปราการ</div>
      </header>

      <aside class="sidebar">
        <div class="brand">
          <div class="brand-icon">⚡</div>
          <div><div style="font-weight:700;">MEA PM Planner</div><div style="font-size:11px;color:#94A3B8;">กฟน. เขตสมุทรปราการ</div></div>
        </div>
        ${navs.map(n => `<button class="nav-btn ${TAB===n.id?'active':''}" onclick="setTab('${n.id}')"><span>${n.icon}</span> ${n.label}</button>`).join('')}
      </aside>

      <main class="main">
        ${TAB === 'dashboard' ? renderDashboard() : ''}
        ${TAB === 'routes' ? renderRoutes() : ''}
        ${TAB === 'entry' ? renderEntry() : ''}
        ${TAB === 'guide' ? renderGuide() : ''}
      </main>

      <nav class="bottom-nav">
        ${navs.map(n => `
          <button class="b-nav-item ${TAB===n.id?'active':''}" onclick="setTab('${n.id}')">
            <span>${n.icon}</span>
            <span>${n.label}</span>
          </button>
        `).join('')}
      </nav>
    </div>
  `;

  if (TAB === 'dashboard') setTimeout(renderCharts, 50);
  if (TAB === 'routes') setTimeout(renderMap, 50);
}

function setTab(t) {
  TAB = t;
  render();
}

function renderDashboard() {
  const totalCost = STATE.pmRecords.reduce((s, r) => s + r.cost, 0);
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <h2 style="margin:0;color:var(--navy);">Dashboard ภาพรวมระบบ</h2>
    </div>
    <div class="kpi-grid">
      <div class="kpi-card">
        <div style="color:var(--muted);font-size:12px;">งาน PM ทั้งหมด</div>
        <div class="kpi-value">${STATE.pmRecords.length}</div>
      </div>
      <div class="kpi-card">
        <div style="color:var(--muted);font-size:12px;">ต้นทุนรวม</div>
        <div class="kpi-value">${baht(totalCost)}</div>
      </div>
    </div>
    <div class="chart-grid">
      <div class="card">
        <h3 style="margin-top:0;">สัดส่วนต้นทุนตามประเภท</h3>
        <div class="chart-wrap"><canvas id="chart1"></canvas></div>
      </div>
      <div class="card">
        <h3 style="margin-top:0;">สถานะการดำเนินงาน</h3>
        <div class="chart-wrap"><canvas id="chart2"></canvas></div>
      </div>
    </div>
  `;
}

function renderCharts() {
  const ctx1 = document.getElementById("chart1");
  if (ctx1 && typeof Chart !== 'undefined') {
    if (CHARTS.c1) CHARTS.c1.destroy();
    CHARTS.c1 = new Chart(ctx1, {
      type: 'bar',
      data: {
        labels: EQUIPMENT_TYPES,
        datasets: [{ label: 'ต้นทุนเฉลี่ย', data: [8500, 4200, 12500], backgroundColor: '#0088FF' }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }

  const ctx2 = document.getElementById("chart2");
  if (ctx2 && typeof Chart !== 'undefined') {
    if (CHARTS.c2) CHARTS.c2.destroy();
    CHARTS.c2 = new Chart(ctx2, {
      type: 'doughnut',
      data: {
        labels: ['เสร็จสิ้น', 'รอดำเนินการ'],
        datasets: [{ data: [28, 2], backgroundColor: ['#10B981', '#F59E0B'] }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }
}

function renderRoutes() {
  return `
    <h2 style="color:var(--navy);margin-bottom:16px;">แผนที่เส้นทางตรวจ</h2>
    <div class="card"><div id="map-container"></div></div>
  `;
}

function renderMap() {
  const el = document.getElementById("map-container");
  if (!el || typeof L === 'undefined') return;
  if (MAP) { MAP.remove(); MAP = null; }
  MAP = L.map('map-container').setView(MEA_HQ, 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(MAP);
  L.marker(MEA_HQ).addTo(MAP).bindPopup('กฟน. เขตสมุทรปราการ').openPopup();
  
  Object.entries(LOCATIONS_COORDS).forEach(([name, coords], idx) => {
    L.circleMarker(coords, { radius: 8, fillColor: '#0088FF', color: '#fff', weight: 2, fillOpacity: 1 })
      .addTo(MAP).bindPopup(`จุดตรวจที่ ${idx+1}: ${name}`);
  });
}

function renderEntry() {
  return `
    <h2 style="color:var(--navy);margin-bottom:16px;">บันทึกข้อมูลงาน PM</h2>
    <div class="card">
      <div class="table-responsive">
        <table>
          <thead><tr><th>รหัส</th><th>ประเภท</th><th>สถานที่</th><th>ต้นทุน</th><th>สถานะ</th></tr></thead>
          <tbody>
            ${STATE.pmRecords.map(r => `
              <tr>
                <td><strong class="mono">${esc(r.equipmentId)}</strong></td>
                <td>${esc(r.equipmentType)}</td>
                <td>${esc(r.location)}</td>
                <td class="mono">${baht(r.cost)}</td>
                <td><span class="pill" style="background:var(--green-soft);color:var(--green);">${esc(r.status)}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderGuide() {
  return `
    <h2 style="color:var(--navy);margin-bottom:16px;">คู่มือเกณฑ์การกรอกข้อมูล</h2>
    <div class="card">
      <p><strong>รูปแบบรหัสอุปกรณ์:</strong> TR-SP-XXXX (หม้อแปลง), LBS-SP-XXXX (โหลดเบรกสวิตช์)</p>
      <p><strong>มาตรฐาน Health Index:</strong> ค่าความสมบูรณ์ต้องไม่ต่ำกว่า 85% ในภาวะปกติ</p>
    </div>
  `;
}

init();
</script>
</body>
</html>
